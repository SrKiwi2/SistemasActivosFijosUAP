<div class="card">
    <div class="card-header d-flex flex-wrap gap-2 justify-content-lg-between align-items-center">
        <h5 class="mb-0">Registro Oficina</h5>
        <div class="d-flex flex-wrap gap-2 align-items-center">

            <!-- Sincronización manual con el DBF: solo administradores -->
            <th:block th:if="${esAdmin}">
                <span class="badge bg-info" id="ultimaSync" data-bs-toggle="tooltip" data-bs-placement="bottom"
                    th:title="'Procesados: ' + (${registrosProcesados ?: 0}) + ' | Nuevos: ' + (${registrosNuevos ?: 0}) + ' | Actualizados: ' + (${registrosActualizados ?: 0}) + ' | Duración: ' + (${duracionUltimaSync ?: 0}) + 's'">
                    <i class="fa-solid fa-clock me-1"></i>
                    Última sync: <span th:text="${ultimaSincronizacion ?: 'Nunca'}">--</span>
                </span>

                <span class="badge" id="estadoSyncBadge"
                    th:classappend="${estadoSync == 'COMPLETADO'} ? 'bg-success' : (${estadoSync == 'ERROR'} ? 'bg-danger' : 'bg-warning')"
                    th:text="${estadoSync ?: 'PENDIENTE'}">
                </span>

                <button id="btnSyncOficina" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-sync me-1"></i> Sincronizar
                </button>

                <button id="btnSyncCompleto" class="btn btn-outline-warning btn-sm" data-bs-toggle="tooltip"
                    data-bs-placement="bottom" title="Forzar sincronización completa (más lento)">
                    <i class="fa-solid fa-database me-1"></i> Sync Completo
                </button>
            </th:block>

            <small th:unless="${esAdmin}" class="text-muted">
                <i class="fa-solid fa-circle-info me-1"></i>
                Lo que registre o modifique se envía solo al VSIAF.
            </small>

            <button type="button" class="btn btn-primary btn-sm" onclick="cargarFormulario()" data-bs-toggle="modal"
                data-bs-target="#modalFormularioOficina">
                <i class="fa-solid fa-plus"></i> Agregar Oficina
            </button>
        </div>
    </div>
    <div class="card-datatable table-responsive pt-0">
        <table class="datatables-basic table table-hover" id="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Entidad</th>
                    <th>Unidad</th>
                    <th>Código Oficina</th>
                    <th>Nombre Oficina</th>
                    <th>VSIAF</th>
                    <th th:if="${esAdmin}">Registro / Modificación</th>
                    <th class="text-center">Opciones</th>
                </tr>
                <tr>
                    <th></th>
                    <th><input type="text" placeholder="Buscar entidad" class="form-control form-control-sm" /></th>
                    <th><input type="text" placeholder="Buscar unidad" class="form-control form-control-sm" /></th>
                    <th><input type="text" placeholder="Buscar código" class="form-control form-control-sm" /></th>
                    <th><input type="text" placeholder="Buscar nombre" class="form-control form-control-sm" /></th>
                    <th><input type="text" placeholder="Estado" class="form-control form-control-sm" /></th>
                    <th th:if="${esAdmin}"><input type="text" placeholder="Usuario" class="form-control form-control-sm" /></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="oficina, index: ${listasOficinas}"
                    th:with="est=${estadosVsiaf != null and oficina.idOficina != null ? estadosVsiaf[oficina.idOficina] : null},
                             codEst=${est != null ? est.codigo() : 'VSIAF'},
                             usuReg=${oficina.registroIdUsuario != null and nombresUsuario != null ? nombresUsuario[oficina.registroIdUsuario] : null},
                             usuMod=${oficina.modificacionIdUsuario != null and nombresUsuario != null ? nombresUsuario[oficina.modificacionIdUsuario] : null}">
                    <td th:text="${index.index + 1}"></td>
                    <td>
                        <span th:if="${oficina?.predio?.entidad != null}"
                            th:text="${oficina.predio.entidad.entidadCodigo}" class="badge bg-primary">
                        </span>
                        <span th:if="${oficina?.predio?.entidad == null}" class="text-muted">—</span>
                    </td>
                    <td th:text="${oficina?.predio?.unidad ?: '—'}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${oficina.codOfi}"></span>
                    </td>
                    <td th:text="${oficina.nombre}"></td>

                    <!-- Estado real del envío al VSIAF (cola del worker) -->
                    <td th:attr="data-estado-vsiaf=${codEst}">
                        <span class="badge"
                              th:classappend="${codEst == 'VSIAF'} ? 'bg-label-success' : (${codEst == 'EN_COLA'} ? 'bg-label-info' : (${codEst == 'ERROR'} ? 'bg-label-danger' : 'bg-label-warning'))"
                              data-bs-toggle="tooltip"
                              th:title="${est != null ? est.detalle() : 'Registrado en el VSIAF.'}">
                            <i class="fa-solid me-1"
                               th:classappend="${codEst == 'VSIAF'} ? 'fa-check' : (${codEst == 'EN_COLA'} ? 'fa-hourglass-half' : (${codEst == 'ERROR'} ? 'fa-triangle-exclamation' : 'fa-cloud-arrow-up'))"></i>
                            <span th:text="${est != null ? est.texto() : 'En VSIAF'}">En VSIAF</span>
                        </span>
                        <span th:if="${conSolicitud != null and conSolicitud.contains(oficina.idOficina)}"
                              class="badge bg-label-warning mt-1 d-inline-block" data-bs-toggle="tooltip"
                              title="Hay una solicitud de autorización pendiente sobre esta oficina">
                            <i class="fa-solid fa-shield-halved me-1"></i>Autorización pendiente
                        </span>
                    </td>

                    <!-- Auditoría: quién registró y quién modificó (solo administradores) -->
                    <td class="small lh-sm" th:if="${esAdmin}">
                        <div th:if="${usuReg != null or oficina.registro != null}">
                            <span class="text-muted">Reg.:</span>
                            <span class="fw-semibold" th:text="${usuReg ?: 'VSIAF / sistema'}"></span>
                            <span class="text-muted" th:if="${oficina.registro != null}"
                                  th:text="${#dates.format(oficina.registro, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                        <div th:if="${usuMod != null}">
                            <span class="text-muted">Mod.:</span>
                            <span class="fw-semibold" th:text="${usuMod}"></span>
                            <span class="text-muted" th:if="${oficina.modificacion != null}"
                                  th:text="${#dates.format(oficina.modificacion, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </td>

                    <td class="text-center">
                        <div class="d-flex justify-content-center align-items-center gap-1">

                            <div th:if="${oficina.idOficina != null}" class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-primary btn-editar-oficina" title="Editar"
                                    th:data-id="${id_encryptado[index.index]}" data-bs-toggle="modal"
                                    data-bs-target="#modalFormularioOficina">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button type="button" class="btn btn-danger btn-eliminar-oficina"
                                    th:title="${esAdmin} ? 'Eliminar' : 'Solicitar eliminación (requiere autorización)'"
                                    th:data-id="${id_encryptado[index.index]}" th:data-nombre="${oficina.nombre}"
                                    th:data-admin="${esAdmin == true}">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>

                            <!-- Reenvío de un registro que no llegó (pendiente o rechazado por el worker) -->
                            <div th:if="${oficina.idOficina != null and (codEst == 'PENDIENTE' or codEst == 'ERROR')}">
                                <button type="button" class="btn btn-warning btn-sm btn-subir-dbf"
                                    th:data-id="${id_encryptado[index.index]}"
                                    data-bs-toggle="tooltip" title="Enviar / reenviar al VSIAF">
                                    <i class="fa-solid fa-cloud-arrow-up"></i>
                                </button>
                            </div>

                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Tooltips de esta tabla (los handlers de los botones viven en oficina/vista.html,
    // que se ejecuta una sola vez: acá se duplicaban en cada recarga de la tabla).
    $(function () {
        document.querySelectorAll('#tablaRegistro [data-bs-toggle="tooltip"]').forEach(function (el) {
            bootstrap.Tooltip.getOrCreateInstance(el);
        });
    });
</script>
