<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: grupoContable/tabla_registro.html — catálogo de grupos contables.
     · Al abrir llega incluido en grupoContable/vista.html (th:replace … :: tabla):
       un pedido. POST /administracion/grupoc/tabla-registros lo devuelve para recargar.
     · .js-sync-info lleva el estado de la última sincronización: la vista lo pasa a
       su cabecera en cada recarga (sin pedirlo aparte).
     · Solo lectura: el catálogo es del VSIAF (CODCONT.DBF) y se trae sincronizando.
     ══════════════════════════════════════════════════════════════ -->
<div class="js-contenido" th:fragment="tabla">
    <span class="js-sync-info d-none"
          th:attr="data-ultima=${ultimaSincronizacion ?: 'Nunca'}, data-estado=${estadoSync ?: 'PENDIENTE'},
                   data-procesados=${registrosProcesados ?: 0}, data-nuevos=${registrosNuevos ?: 0},
                   data-actualizados=${registrosActualizados ?: 0}, data-duracion=${duracionUltimaSync ?: 0},
                   data-origen=${sourceUsed}"></span>

    <table class="table sm-tabla align-middle js-tabla-grupos">
        <thead>
            <tr>
                <th style="width:120px;">Código</th>
                <th>Grupo contable</th>
                <th style="width:140px;">Vida útil</th>
                <th style="width:130px;">Deprecia</th>
                <th style="width:130px;">Actualiza</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="gc : ${listasGrupoContable}"
                th:attr="data-deprecia=${gc.depreciar != null and gc.depreciar}, data-actualiza=${gc.actualizar != null and gc.actualizar}">
                <td th:attr="data-order=${gc.codContable}">
                    <span class="sm-codigo" th:text="${gc.codContable}"></span>
                </td>
                <td class="sm-nombre" th:text="${gc.nombre}"></td>
                <td th:attr="data-order=${gc.vidaUtil ?: 0}">
                    <span th:if="${gc.vidaUtil != null}" th:text="${gc.vidaUtil} + ' años'"></span>
                    <span th:if="${gc.vidaUtil == null}" class="sm-sub">—</span>
                </td>
                <td>
                    <span th:if="${gc.depreciar != null and gc.depreciar}" class="sm-pastilla sm-pastilla-activo py-0">Sí</span>
                    <span th:unless="${gc.depreciar != null and gc.depreciar}" class="sm-pastilla py-0">No</span>
                </td>
                <td>
                    <span th:if="${gc.actualizar != null and gc.actualizar}" class="sm-pastilla sm-pastilla-info py-0"><i class="ti ti-check"></i> Sí</span>
                    <span th:unless="${gc.actualizar != null and gc.actualizar}" class="sm-pastilla py-0">No</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
