<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: comunicado/tabla.html — comunicados enviados (plantilla de mantenimiento).
     · Al abrir llega incluido en comunicado/vista.html (th:replace … :: tabla): un pedido.
       POST /administracion/comunicados/tabla lo devuelve para recargar.
     · Cada fila lleva sus datos en data-* para el filtro por tipo y los totales.
     · Sin onclick: el botón declara data-accion y lo atiende la vista.
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle" th:fragment="tabla">
    <thead>
        <tr>
            <th style="width:150px;">Enviado</th>
            <th>Comunicado</th>
            <th style="width:290px;">Lectura</th>
            <th class="text-end" style="width:150px;">Opciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${comunicados}"
            th:attr="data-id=${c.id}, data-tipo=${c.tipo}, data-importante=${c.importante},
                     data-total=${c.total}, data-leyeron=${c.leyeron}, data-pct=${c.pct}">
            <td th:attr="data-order=${c.fechaOrden}">
                <span class="sm-codigo" th:text="${c.fecha}"></span>
            </td>
            <td>
                <div class="d-flex align-items-start gap-2">
                    <span class="sm-pastilla py-0 flex-shrink-0" th:switch="${c.tipo}"
                          th:classappend="${c.tipo == 'URGENTE'} ? 'sm-pastilla-peligro' : (${c.tipo == 'TRABAJO'} ? 'sm-pastilla-info' : (${c.tipo == 'AVISO'} ? 'sm-pastilla-aviso' : ''))">
                        <th:block th:case="'URGENTE'"><i class="ti ti-urgent"></i> Urgente</th:block>
                        <th:block th:case="'TRABAJO'"><i class="ti ti-briefcase"></i> Trabajo</th:block>
                        <th:block th:case="'AVISO'"><i class="ti ti-bell"></i> Aviso</th:block>
                        <th:block th:case="*"><i class="ti ti-message"></i> General</th:block>
                    </span>
                    <div class="sm-persona-texto">
                        <span class="fw-semibold">
                            <i th:if="${c.importante}" class="ti ti-star-filled text-warning" title="Importante"></i>
                            <span th:text="${c.titulo}"></span>
                        </span>
                        <span class="sm-sub"><i class="ti ti-target-arrow"></i> <span th:text="${c.alcanceDetalle}"></span></span>
                    </div>
                </div>
            </td>
            <td th:attr="data-order=${c.pct}">
                <div class="sm-progreso">
                    <div class="sm-progreso-barra" th:classappend="${c.pct == 0} ? 'nulo' : (${c.pct < 60} ? 'bajo' : '')">
                        <span th:style="'width:' + ${c.pct} + '%'"></span>
                    </div>
                    <span class="sm-progreso-pct" th:text="${c.pct} + '%'"></span>
                </div>
                <div class="sm-sub mt-1">
                    <strong th:text="${c.leyeron}"></strong> de <span th:text="${c.total}"></span> confirmaron ·
                    <span th:text="${c.recibieron}"></span> recibieron
                </div>
            </td>
            <td class="text-end">
                <button type="button" class="sm-btn sm-btn-sm sm-btn-suave" data-accion="detalle"
                        title="Quién lo recibió y quién confirmó la lectura">
                    <i class="ti ti-clipboard-check"></i> Ver control
                </button>
            </td>
        </tr>
    </tbody>
</table>
