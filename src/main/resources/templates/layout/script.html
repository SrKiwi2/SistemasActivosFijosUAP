    <script>
        $.ajaxSetup({
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });

        var botonPulsado;
        $(document).ready(function () {

            if (document.body.dataset.ctx === "admin" && $("#contenido").length) {
                cargarContenido("/adm/inicio");
            }

            // Navegación del menú: cada ítem del sidebar trae su URL en data-url
            // (renderizado dinámicamente desde la tabla opcion_menu). Ya no se
            // mantiene un diccionario hardcodeado: agregar una opción no requiere
            // tocar este JS.
            $(".menu-item").click(function (e) {
                const url = $(this).attr("data-url");

                // Grupos / encabezados no tienen data-url: solo despliegan submenú.
                if (!url) {
                    return;
                }

                e.preventDefault();

                // Cargar el contenido de la URL
                cargarContenido(url);

                // Resaltar solo el ítem seleccionado
                $(".menu-item").removeClass("active");
                $(this).addClass("active");
            });

            function cargarContenido(url) {
                $.ajax({
                    url: "/adm/cargar-datos",
                    method: "GET",
                    success: function () {
                        $.ajax({
                            url: url,
                            method: "GET",
                            success: function (data) {
                                $("#contenido").html(data);
                            },
                            error: function (xhr) {
                                console.error('Error en la solicitud:', xhr);
                            }
                        });
                    },
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            Swal.fire({
                                title: 'Sesión expirada',
                                text: 'Tu sesión ha expirado. Por favor, inicia sesión nuevamente.',
                                icon: 'warning',
                                confirmButtonText: 'Ir al login'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    window.location.href = '/';
                                }
                            });
                        }
                    }
                });
            }
        });
    </script>
