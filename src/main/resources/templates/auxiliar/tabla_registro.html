<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: auxiliar/tabla_registro.html — auxiliares (plantilla de mantenimiento).
     · POST /administracion/auxiliar/tabla-registros lo devuelve: la vista lo pide al abrir
       (con el preloader en la tarjeta) y para recargar.
     · .js-sync-info: estado de la última sincronización (la vista lo pasa a su cabecera).
     · Cada fila lleva data-* para los filtros (predio, grupo); los botones declaran
       data-accion y los atiende la vista. Una fila sin id viene directo del VSIAF
       (la base todavía no la tiene): es solo lectura.
     ══════════════════════════════════════════════════════════════ -->
<div class="js-contenido" th:fragment="tabla">
    <span class="js-sync-info d-none"
          th:attr="data-ultima=${ultimaSincronizacion ?: 'Nunca'}, data-estado=${estadoSync ?: 'PENDIENTE'},
                   data-procesados=${registrosProcesados ?: 0}, data-nuevos=${registrosNuevos ?: 0},
                   data-actualizados=${registrosActualizados ?: 0}, data-duracion=${duracionUltimaSync ?: 0},
                   data-origen=${sourceUsed}"></span>

    <table class="table sm-tabla align-middle js-tabla-aux">
        <thead>
            <tr>
                <th style="width:170px;">Predio</th>
                <th style="width:120px;">Grupo</th>
                <th style="width:110px;">Cód. aux.</th>
                <th>Auxiliar</th>
                <th class="text-end" style="width:250px;">Opciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a, it : ${listasAuxiliares}"
                th:with="ent=${a.predio != null and a.predio.entidad != null ? a.predio.entidad.entidadCodigo : ''},
                         uni=${a.predio != null ? a.predio.unidad : ''},
                         grp=${a.grupoContable != null ? a.grupoContable.codContable : null}"
                th:attr="data-predio=${ent + ' · ' + uni}, data-grupo=${grp}">
                <td th:attr="data-order=${ent + '-' + uni}">
                    <span class="sm-codigo" th:text="${uni ?: '—'}"></span>
                    <div class="sm-sub" th:if="${ent != ''}" th:text="'Entidad ' + ${ent}"></div>
                </td>
                <td th:attr="data-order=${grp ?: 0}">
                    <span th:if="${grp != null}" class="sm-pastilla sm-pastilla-info py-0" th:text="${grp}"
                          th:title="${a.grupoContable.nombre}"></span>
                    <span th:if="${grp == null}" class="sm-sub">—</span>
                </td>
                <td th:attr="data-order=${a.codAux ?: 0}">
                    <span class="sm-codigo" th:text="${a.codAux}"></span>
                </td>
                <td>
                    <span class="sm-nombre" th:text="${a.nombre}"></span>
                    <div class="sm-sub" th:if="${a.grupoContable != null and a.grupoContable.nombre != null}"
                         th:text="${a.grupoContable.nombre}"></div>
                </td>
                <td class="text-end">
                    <div class="sm-acciones" th:if="${a.idAuxiliar != null}"
                         th:attr="data-id=${id_encryptado[it.index]}, data-nombre=${a.nombre}">
                        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave" data-accion="editar"
                                title="Modificar nombre, predio o grupo (se actualiza también en el VSIAF)">
                            <i class="ti ti-edit"></i> Editar</button>
                        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-icono" data-accion="reenviar"
                                title="Reenviar al VSIAF (si allá no aparece). No duplica si ya existe.">
                            <i class="ti ti-send"></i></button>
                        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro sm-btn-icono" data-accion="eliminar"
                                title="Quitar del SCIAF">
                            <i class="ti ti-trash"></i></button>
                    </div>
                    <span th:if="${a.idAuxiliar == null}" class="sm-pastilla sm-pastilla-aviso py-0"
                          title="Viene directo del VSIAF: sincronice para poder editarlo">
                        <i class="ti ti-lock"></i> Solo lectura</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
