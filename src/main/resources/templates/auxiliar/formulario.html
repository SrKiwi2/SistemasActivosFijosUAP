<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: auxiliar/formulario.html  (va dentro de .modal-content.sm-modal)
     El envío lo hace SciafModulo.formulario() y espera JSON { ok, msg, vsiaf }.
     · Código auxiliar: lo calcula el servidor según predio + grupo (correlativo).
     · Nombre: único dentro del predio + grupo (se verifica mientras se escribe; el
       servidor vuelve a validar). Se guarda en MAYÚSCULAS.
     Sin loader de pantalla completa: el progreso se ve en el propio campo.
     ══════════════════════════════════════════════════════════════ -->
<div class="sm-modal-cab">
    <div class="sm-cabecera-icono">
        <i class="ti" th:classappend="${edit} ? 'ti-edit' : 'ti-folder-plus'"></i>
    </div>
    <div>
        <h5 class="sm-modal-titulo" th:text="${edit} ? 'Modificar auxiliar' : 'Nuevo auxiliar'">Auxiliar</h5>
        <p class="sm-modal-sub"
           th:text="${edit} ? 'Los cambios se guardan aquí y se envían al VSIAF.' : 'Se registra aquí y se envía al VSIAF con su código correlativo.'"></p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>

<form id="formularioAuxiliar" method="post"
    th:action="${edit} ? @{/administracion/auxiliar/modificar-auxiliar} : @{/administracion/auxiliar/registrar-auxiliar}"
    novalidate>
    <input type="hidden" th:if="${edit != null}" th:field="*{auxiliar.idAuxiliar}">

    <div class="sm-modal-cuerpo">
        <div class="sm-seccion">
            <div class="sm-seccion-cab"><i class="ti ti-map-pin"></i> Dónde va</div>
            <div class="sm-seccion-cuerpo">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="sm-label" for="selectPredio">Predio <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <select id="selectPredio" th:field="*{auxiliar.predio.idPredio}" class="form-select select2" required>
                                <option value="">Seleccione…</option>
                                <option th:each="p : ${predios}" th:value="${p.idPredio}"
                                        th:text="${p.descrip + ' (' + p.codigo + ')'}"></option>
                            </select>
                            <div class="invalid-feedback">Elija el predio.</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="sm-label" for="selectGrupoContable">Grupo contable <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <select id="selectGrupoContable" th:field="*{auxiliar.grupoContable.idGrupoContable}"
                                    class="form-select select2" required>
                                <option value="">Seleccione…</option>
                                <option th:each="g : ${gruposContables}" th:value="${g.idGrupoContable}"
                                        th:text="${g.nombre + ' (' + g.codContable + ')'}"></option>
                            </select>
                            <div class="invalid-feedback">Elija el grupo contable.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sm-seccion">
            <div class="sm-seccion-cab"><i class="ti ti-folder"></i> Auxiliar</div>
            <div class="sm-seccion-cuerpo">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="sm-label" for="inputCodAux">Código <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <i class="ti ti-hash js-icono-cod"></i>
                            <input id="inputCodAux" type="number" th:field="*{auxiliar.codAux}" class="sm-input"
                                   placeholder="Ej: 101" required data-sm-mayus="no" />
                            <div class="invalid-feedback">Ingrese el código.</div>
                        </div>
                        <div class="sm-ayuda js-ayuda-cod">Se calcula al elegir predio y grupo.</div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="sm-label" for="nombreAuxiliarInput">Nombre <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <i class="ti ti-tag js-icono-nombre"></i>
                            <input id="nombreAuxiliarInput" type="text" th:field="*{auxiliar.nombre}" class="sm-input"
                                   placeholder="Ej: MUEBLES Y ENSERES" required maxlength="255" autocomplete="off" />
                            <div class="invalid-feedback" id="nombreAuxiliarFeedback">Ingrese el nombre del auxiliar.</div>
                        </div>
                        <div class="sm-ayuda">No puede repetirse dentro del mismo predio y grupo contable.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="sm-modal-pie">
        <span class="sm-nota"><span class="sm-req">*</span> Campo obligatorio</span>
        <button type="button" class="sm-btn sm-btn-neutro" data-bs-dismiss="modal" id="btnCancelarAuxiliar">
            <i class="ti ti-x"></i> Cancelar
        </button>
        <button type="submit" class="sm-btn sm-btn-exito" id="btnGuardarAuxiliar">
            <i class="ti ti-device-floppy"></i>
            <span th:text="${edit} ? 'Guardar cambios' : 'Registrar auxiliar'">Guardar</span>
        </button>
    </div>
</form>

<script>
    (function () {
        const $form = $('#formularioAuxiliar');
        const esEdicion = $form.find('input[name="idAuxiliar"]').length > 0;
        const predio = document.getElementById('selectPredio');
        const grupo = document.getElementById('selectGrupoContable');
        const codAux = document.getElementById('inputCodAux');
        const nombre = document.getElementById('nombreAuxiliarInput');
        const $feedback = $('#nombreAuxiliarFeedback');
        let nombreRepetido = false;

        /** Ícono del campo como indicador: girando mientras consulta. */
        function trabajando($icono, si, normal) {
            $icono.attr('class', si ? 'ti ti-loader-2' : 'ti ' + normal);
            // spinner-border: la animación de giro que ya trae Bootstrap.
            $icono.css('animation', si ? 'spinner-border .8s linear infinite' : '');
        }

        /* ── Código correlativo (lo calcula el servidor) ─────────────────── */
        function actualizarCodAux() {
            if (!predio.value || !grupo.value) {
                if (!esEdicion) { codAux.value = ''; codAux.readOnly = false; }
                return;
            }
            const $icono = $form.find('.js-icono-cod');
            trabajando($icono, true);
            fetch('/administracion/auxiliar/obtener-cod-auxiliar?idPredio=' + encodeURIComponent(predio.value)
                    + '&idGrupoContable=' + encodeURIComponent(grupo.value), { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
                .then(cod => {
                    codAux.value = cod;
                    codAux.readOnly = true;
                    $(codAux).removeClass('is-invalid');
                    $form.find('.js-ayuda-cod').text('Siguiente número libre en ese predio y grupo.');
                })
                .catch(() => $form.find('.js-ayuda-cod').text('No se pudo calcular: escríbalo a mano.'))
                .finally(() => trabajando($icono, false, 'ti-hash js-icono-cod'));
        }

        /* ── Nombre único dentro del predio + grupo ──────────────────────── */
        let espera = null;
        function validarNombre() {
            clearTimeout(espera);
            nombreRepetido = false;
            $(nombre).removeClass('is-invalid is-valid');
            const n = nombre.value.trim();
            if (!n || !predio.value || !grupo.value) return;   // sin ámbito no hay con qué comparar
            espera = setTimeout(function () {
                const idAux = $form.find('input[name="idAuxiliar"]').val();
                const $icono = $form.find('.js-icono-nombre');
                trabajando($icono, true);
                fetch('/administracion/auxiliar/validar-nombre-unico?nombre=' + encodeURIComponent(n)
                        + '&idPredio=' + encodeURIComponent(predio.value) + '&idGrupoContable=' + encodeURIComponent(grupo.value)
                        + (idAux ? '&idAuxiliar=' + encodeURIComponent(idAux) : ''),
                        { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(r => { if (!r.ok) throw new Error('red'); return r.json(); })
                    .then(unico => {
                        nombreRepetido = !unico;
                        if (nombreRepetido) {
                            $feedback.text('Ya hay un auxiliar con ese nombre en este predio y grupo contable.');
                            $(nombre).addClass('is-invalid');
                        } else {
                            $(nombre).addClass('is-valid');
                        }
                    })
                    // Si no responde no se bloquea: el servidor vuelve a validar y tiene la última palabra.
                    .catch(() => {})
                    .finally(() => trabajando($icono, false, 'ti-tag js-icono-nombre'));
            }, 350);
        }

        $(predio).on('change', function () { actualizarCodAux(); validarNombre(); });
        $(grupo).on('change', function () { actualizarCodAux(); validarNombre(); });
        nombre.addEventListener('input', function () {
            $feedback.text('Ingrese el nombre del auxiliar.');
            validarNombre();
        });
        // Select2 no avisa con "input": se limpia la marca al elegir.
        $form.on('select2:select', 'select', function () { $(this).removeClass('is-invalid'); });

        if (!esEdicion) setTimeout(actualizarCodAux, 100);

        SciafModulo.formulario({
            form: '#formularioAuxiliar',
            modal: '#modalFormularioAuxiliar',
            guardar: '#btnGuardarAuxiliar',
            cancelar: '#btnCancelarAuxiliar',
            textoGuardando: esEdicion ? 'Guardando…' : 'Registrando…',
            msgExito: esEdicion ? 'Auxiliar modificado' : 'Auxiliar registrado',
            confirmacion: function () {
                return {
                    titulo: esEdicion ? '¿Guardar los cambios del auxiliar?' : '¿Registrar el auxiliar?',
                    texto: '<b>' + SciafModulo.escapar(nombre.value.trim().toLocaleUpperCase('es')) + '</b> · código '
                        + SciafModulo.escapar(codAux.value) + '<br><small class="text-muted">Se guarda aquí y se envía al VSIAF.</small>',
                    aceptar: esEdicion ? 'Sí, guardar' : 'Sí, registrar'
                };
            },
            validar: function () {
                if (nombreRepetido) { $(nombre).addClass('is-invalid'); return false; }
                return true;
            },
            // Guardado en la base pero sin llegar al VSIAF: se avisa claro (no es un error a repetir).
            alGuardar: function (r) {
                if (r && r.vsiaf === 'ERROR') {
                    Swal.fire({ icon: 'warning', title: 'Guardado, pero no llegó al VSIAF', text: r.msg });
                }
            }
            // La tabla la recarga la vista (SciafModulo.alGuardarModal).
        });
    })();
</script>
