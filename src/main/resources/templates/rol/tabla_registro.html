<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: rol/tabla_registro.html
     Solo la tabla: la tarjeta, el buscador y el selector de filas están en
     rol/vista.html, y SciafModulo.tabla() los conecta (sciaf-modulo.js).
     El listado ya trae solo roles ACTIVOS (IRolDao.listarRoles), por eso no
     hay columna ni filtro de estado.
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle" id="data-table">
    <thead>
        <tr>
            <th style="width:70px;">#</th>
            <th>Rol</th>
            <th style="width:220px;">Usuarios asignados</th>
            <th class="text-end" style="width:240px;">Opciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="rol, index : ${listaRoles}"
            th:with="nUsuarios=${rol.usuarios == null ? 0 : #lists.size(rol.usuarios.?[estado == 'ACTIVO'])}"
            th:attr="data-usuarios=${nUsuarios}">
            <td class="sm-num" th:text="${index.index + 1}"></td>
            <td class="sm-nombre" th:text="${rol.nombre}"></td>
            <td th:attr="data-order=${nUsuarios}">
                <span th:if="${nUsuarios > 0}" class="sm-pastilla sm-pastilla-activo"
                    th:text="${nUsuarios == 1} ? '1 usuario' : ${nUsuarios + ' usuarios'}"></span>
                <span th:unless="${nUsuarios > 0}" class="sm-pastilla">Sin usuarios</span>
            </td>
            <td class="text-end">
                <div class="sm-acciones">
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave btn-editar-rol"
                        th:data-id="${id_encryptado[index.index]}" title="Modificar este rol">
                        <i class="ti ti-edit"></i> Editar
                    </button>
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro btn-eliminar-rol"
                        th:data-id="${id_encryptado[index.index]}" th:data-nombre="${rol.nombre}"
                        title="Eliminar este rol">
                        <i class="ti ti-trash"></i> Eliminar
                    </button>
                </div>
            </td>
        </tr>
    </tbody>
</table>
