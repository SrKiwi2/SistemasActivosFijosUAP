<style>
    /* ── Card moderna con profundidad ───────────────────── */
    .card-rol {
        border: 0;
        border-radius: 1rem;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        background: #fff;
    }

    .card-rol .card-header {
        background: linear-gradient(90deg, rgba(26, 86, 160, 0.07) 0%, transparent 100%);
        border-bottom: 2px solid #1a56a0;
        border-radius: 1rem 1rem 0 0 !important;
        padding: 1rem 1.25rem;
    }

    /* ── Botón principal con elevación ──────────────────── */
    .btn-rol-primary {
        background: linear-gradient(135deg, #1a56a0 0%, #2563eb 100%);
        border: 0;
        border-radius: 0.5rem;
        padding: 0.55rem 1.1rem;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(26, 86, 160, 0.25);
        transition: all 0.2s ease;
    }

    .btn-rol-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(26, 86, 160, 0.35);
        background: linear-gradient(135deg, #17488a 0%, #1d4ed8 100%);
    }

    /* ── Tabla con animación de entrada escalonada ──────── */
    #data-table tbody tr {
        opacity: 0;
        animation: rowIn 0.4s ease-out forwards;
    }

    @keyframes rowIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    #data-table tbody tr:nth-child(1)  { animation-delay: 0ms; }
    #data-table tbody tr:nth-child(2)  { animation-delay: 50ms; }
    #data-table tbody tr:nth-child(3)  { animation-delay: 100ms; }
    #data-table tbody tr:nth-child(4)  { animation-delay: 150ms; }
    #data-table tbody tr:nth-child(5)  { animation-delay: 200ms; }
    #data-table tbody tr:nth-child(6)  { animation-delay: 250ms; }
    #data-table tbody tr:nth-child(7)  { animation-delay: 300ms; }
    #data-table tbody tr:nth-child(8)  { animation-delay: 350ms; }
    #data-table tbody tr:nth-child(9)  { animation-delay: 400ms; }
    #data-table tbody tr:nth-child(10) { animation-delay: 450ms; }

    /* ── Badges semánticos ──────────────────────────────── */
    .badge-rol { font-weight: 600; padding: 0.4rem 0.7rem; font-size: 0.78rem; }
    .badge-rol-active   { background: rgba(16, 185, 129, 0.12); color: #059669; }
    .badge-rol-inactive { background: rgba(245, 158, 11, 0.12); color: #b45309; }

    /* ── Botones de acción en tabla ─────────────────────── */
    .btn-action-sm {
        width: 34px;
        height: 34px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.375rem;
        transition: all 0.15s ease;
    }

    .btn-action-sm i { font-size: 0.85rem; }

    .btn-edit-action { background: rgba(26, 86, 160, 0.1); color: #1a56a0; border: 1px solid rgba(26, 86, 160, 0.2); }
    .btn-edit-action:hover { background: #1a56a0; color: #fff; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(26, 86, 160, 0.3); }

    .btn-delete-action { background: rgba(220, 38, 38, 0.1); color: #dc2626; border: 1px solid rgba(220, 38, 38, 0.2); }
    .btn-delete-action:hover { background: #dc2626; color: #fff; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3); }

    /* ── Filtros por columna (segunda fila thead) ───────── */
    #data-table thead tr.filters th input {
        width: 100%;
        padding: 0.35rem 0.6rem;
        font-size: 0.78rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.375rem;
        background: #f8fafc;
        transition: all 0.15s ease;
    }

    #data-table thead tr.filters th input:focus {
        outline: none;
        border-color: #1a56a0;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(26, 86, 160, 0.1);
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 576px) {
        .card-rol .card-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
        .btn-rol-primary { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
        #data-table tbody tr { animation: none !important; opacity: 1; }
        .btn-rol-primary:hover, .btn-action-sm:hover { transform: none; }
    }
</style>

<!-- ═══════════════════════════════════════════════════════════════
     TABLA DE ROLES — Estilo moderno con profundidad y animaciones
     ══════════════════════════════════════════════════════════════ -->
<div class="card card-rol">
    <!-- Header con gradiente sutil y borde azul institucional -->
    <div class="card-header d-flex flex-wrap gap-2 justify-content-lg-between align-items-center">
        <h5 class="mb-0 fw-semibold text-slate-800">
            <i class="fa-solid fa-user-shield text-primary me-2"></i>Registro de Roles
        </h5>
        <button type="button" class="btn btn-rol-primary" onclick="cargarFormulario()" data-bs-toggle="modal"
            data-bs-target="#modalFormularioRol">
            <i class="fa-solid fa-plus me-1"></i> Agregar Rol
        </button>
    </div>

    <div class="card-datatable table-responsive pt-0">
        <table class="datatables-basic table table-hover align-middle mb-0" id="data-table" style="width:100%">
            <thead>
                <tr class="text-uppercase text-muted small" style="background:#f8fafc; border-bottom:2px solid #e2e8f0;">
                    <th style="width:50px;">#</th>
                    <th>ROL</th>
                    <th style="width:130px;">ESTADO</th>
                    <th class="text-center" style="width:110px;">OPCIONES</th>
                </tr>
                <!-- Fila de filtros por columna -->
                <tr class="filters">
                    <th></th>
                    <th><input type="text" placeholder="Buscar rol…" class="form-control form-control-sm" /></th>
                    <th><input type="text" placeholder="Estado…" class="form-control form-control-sm" /></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rol, index: ${listaRoles}">
                    <td class="text-muted small fw-medium" th:text="${index.index + 1}"></td>
                    <td class="fw-medium" th:text="${rol.nombre}"></td>
                    <td>
                        <span class="badge badge-rol"
                              th:classappend="${rol.estado == 'ACTIVO'} ? 'badge-rol-active' : 'badge-rol-inactive'"
                              th:text="${rol.estado == 'ACTIVO'} ? 'Activo' : 'Eliminado'"></span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center align-items-center gap-1">
                            <button type="button"
                                class="btn btn-action-sm btn-edit-action btn-editar-rol"
                                th:data-id="${id_encryptado[index.index]}"
                                data-bs-toggle="modal"
                                data-bs-target="#modalFormularioRol"
                                title="Editar rol">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button type="button"
                                class="btn btn-action-sm btn-delete-action btn-eliminar-rol"
                                th:data-id="${id_encryptado[index.index]}"
                                th:data-nombre="${rol.nombre}"
                                title="Eliminar rol"
                                data-bs-toggle="tooltip"
                                data-bs-placement="top">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Tooltips de esta tabla (los handlers de los botones viven en rol/vista.html)
    $(function () {
        document.querySelectorAll('#tablaRegistro [data-bs-toggle="tooltip"]').forEach(function (el) {
            bootstrap.Tooltip.getOrCreateInstance(el);
        });
    });
</script>
