<h4 class="py-3 mb-4"><span class="text-muted fw-light">Menú /</span> Rol</h4>

<div id="tablaRegistro"></div>

<!-- Modal estructurado correctamente -->
<div class="modal fade" id="modalFormularioRol" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" id="contenidoModalRol"></div>
    </div>
</div>

<script>
    $(document).ready(function () {
        cargarTabla();

        // Auto-refresco por SSE si se usa en otros módulos
        if (window.registrarTablaSse) window.registrarTablaSse('rol', function () { cargarTabla(); });
    });

    // ── Inicialización DataTable con filtros por columna ──────────────────
    function initDataTable() {
        const $tbl = $('#data-table');
        if ($.fn.DataTable.isDataTable($tbl)) $tbl.DataTable().destroy();

        $tbl.DataTable({
            destroy: true,
            orderCellsTop: true,
            language: {
                sProcessing: "Procesando...",
                sLengthMenu: "Mostrar _MENU_ registros",
                sZeroRecords: "No se encontraron resultados",
                sInfo: "Mostrando del _START_ al _END_ de _TOTAL_ registros",
                sInfoEmpty: "Mostrando 0 de 0 registros",
                sInfoFiltered: "(filtrado de _MAX_ registros)",
                sSearch: "Buscar general:",
                sLoadingRecords: "Cargando...",
                oPaginate: {
                    sFirst: "Primero",
                    sLast: "Último",
                    sNext: "Siguiente",
                    sPrevious: "Anterior"
                }
            },
            initComplete: function () {
                // Inicializar tooltips de esta tabla
                $tbl.find('[data-bs-toggle="tooltip"]').each(function (i, el) {
                    bootstrap.Tooltip.getOrCreateInstance(el);
                });
            }
        });
    }

    function cargarTabla() {
        // Loader DENTRO de la tabla (no bloquea toda la pantalla)
        $("#tablaRegistro").html(`
            <div class="text-center text-muted py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2">Cargando roles…</div>
            </div>
        `);

        $.ajax({
            type: 'POST',
            url: "/administracion/rol/tabla-registros",
            success: function (html) {
                $("#tablaRegistro").html(html);
                initDataTable();
            },
            error: function (xhr) {
                $("#tablaRegistro").html(`<div class="alert alert-danger m-3">Error cargando tabla</div>`);
            }
        });
    }

    function cargarFormulario() {
        cargarFormularioAlert("/administracion/rol/formulario", "#contenidoModalRol", "#formularioRol");
    }

    function cargarFormularioEdit(id) {
        cargarFormularioEditAlert(id, "/administracion/rol/formulario-edit", "#contenidoModalRol", "#formularioRol");
    }

    function eliminar(nombre, id) {
        eliminarRegistroAlert(nombre, id, "/administracion/rol/eliminar", cargarTabla);
    }

    // ── Delegación de eventos (una sola vez; el fragmento se recarga seguido) ──
    $(document).off('click.rolMod', '.btn-editar-rol').on('click.rolMod', '.btn-editar-rol', function () {
        cargarFormularioEdit($(this).data('id'));
    });

    $(document).off('click.rolMod', '.btn-eliminar-rol').on('click.rolMod', '.btn-eliminar-rol', function () {
        eliminar($(this).data('nombre'), $(this).data('id'));
    });
</script>
