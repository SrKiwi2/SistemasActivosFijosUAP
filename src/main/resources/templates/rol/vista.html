<h4 class="py-3 mb-4"><span class="text-muted fw-light">Menú /</span> Rol</h4>

<!-- Este div se adaptará al scrollX configurado en DataTables -->
<div id="tablaRegistro" class="w-100"></div>

<!-- Modal estructurado correctamente -->
<div class="modal fade" id="modalFormularioRol" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" id="contenidoModalRol"></div>
    </div>
</div>

<script>
    $(document).ready(function () {
        cargarTabla();
    });

    function cargarTabla() {
        showGlobalLoader({ imgUrl:'/assets/img/logo/activofijos.png', axis:'y', speed:1.2, texto:'Cargando...' });
        
        $.ajax({
            type: 'POST',
            url: "/administracion/rol/tabla-registros",
            success: function (response) {
                $("#tablaRegistro").html(response);
            },
            error:function(){
                $("#tablaRegistro").html(`
                    <div class="alert alert-danger m-3">
                    Ocurrió un error al cargar la tabla.
                    <button class="btn btn-sm btn-outline-light ms-2" onclick="cargarTabla()">Reintentar</button>
                    </div>
                `);
            },
            complete:function(){
                hideGlobalLoader();
            }
        });
    }

    function cargarFormulario() {
        cargarFormularioAlert("/administracion/rol/formulario", "#contenidoModalRol", "#formularioRol");
    }

    function cargarFormularioEdit(id) {
        cargarFormularioEditAlert(id, "/administracion/rol/formulario-edit", "#contenidoModalRol", "#formularioRol");
    }

    function eliminar(nombre, id) {
        eliminarRegistroAlert(nombre, id, "/administracion/rol/eliminar", cargarTabla);
    }
</script>
