<div class="modal-header">
    <h4 class="modal-title" th:text="${edit}? 'Modificar Rol' : 'Registrar Rol'"></h4>
    <a type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></a>
</div>
<form id="formularioRol" method="post"
    th:action="${edit}? @{/administracion/rol/modificar-rol} : @{/administracion/rol/registrar-rol}" novalidate>
    <input type="hidden" th:if="${edit != null}" th:field="${rol.idRol}">
    
    <div class="modal-body">
        <div class="row">
            <!-- Ampliado a col-12 para mejor uso del espacio en móviles -->
            <div class="col-12 mb-3">
                <label class="form-label" for="modalEditUserLastName">Rol</label>
                <input type="text" th:field="${rol.nombre}" class="form-control" placeholder="..." required />
                <div class="valid-feedback">Correcto!</div>
                <div class="invalid-feedback">Por favor introduzca un dato válido.</div>
            </div>
        </div>
    </div>
    
    <div class="modal-footer">
        <!-- Uso de flexbox nativo para alinear botones correctamente a la derecha -->
        <div class="d-flex justify-content-end gap-2 w-100">
            <a type="button" class="btn btn-secondary text-white" data-bs-dismiss="modal">Cancelar</a>
            <input type="submit" class="btn btn-success" th:value="${edit}? 'Guardar Cambios': 'Guardar Registro'">
        </div>
    </div>
</form>

<script>
    manejarEnvioFormulario('#formularioRol');
</script>
