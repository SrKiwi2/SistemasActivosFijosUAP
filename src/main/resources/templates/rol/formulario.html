<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: rol/formulario.html  (va dentro de .modal-content.sm-modal)
     Estructura de la plantilla: cabecera · cuerpo con secciones · pie.
     El envío lo hace SciafModulo.formulario() y espera JSON { ok, msg }.
     ══════════════════════════════════════════════════════════════ -->

<div class="sm-modal-cab">
    <div class="sm-cabecera-icono">
        <i class="ti" th:classappend="${edit} ? 'ti-edit' : 'ti-shield-plus'"></i>
    </div>
    <div>
        <h5 class="sm-modal-titulo" th:text="${edit} ? 'Modificar rol' : 'Nuevo rol'">Rol</h5>
        <p class="sm-modal-sub"
            th:text="${edit} ? 'Cambie el nombre del rol; los usuarios asignados lo conservan.' : 'Cree un perfil de acceso para asignarlo a los usuarios.'">
        </p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>

<form id="formularioRol" method="post"
    th:action="${edit} ? @{/administracion/rol/modificar-rol} : @{/administracion/rol/registrar-rol}"
    th:object="${rol}" novalidate>

    <!-- ID (solo en edición) -->
    <input type="hidden" th:if="${edit != null}" th:field="*{idRol}" name="idRol">

    <div class="sm-modal-cuerpo">

        <!-- Auditoría (solo edición) -->
        <div th:if="${edit != null}" class="sm-auditoria">
            <i class="ti ti-history"></i>
            <span>
                Registrado
                <th:block th:if="${registradoPor != null}">por <strong th:text="${registradoPor}"></strong></th:block>
                <th:block th:if="${rol.registro != null}" th:text="${'el ' + #dates.format(rol.registro, 'dd/MM/yyyy HH:mm')}"></th:block>
                <th:block th:if="${modificadoPor != null}">
                    · última modificación por <strong th:text="${modificadoPor}"></strong>
                    <th:block th:if="${rol.modificacion != null}" th:text="${'el ' + #dates.format(rol.modificacion, 'dd/MM/yyyy HH:mm')}"></th:block>
                </th:block>
            </span>
        </div>

        <div class="sm-seccion">
            <div class="sm-seccion-cab"><i class="ti ti-info-circle"></i> Datos del rol</div>
            <div class="sm-seccion-cuerpo">
                <label class="sm-label" for="inputNombre">
                    Nombre del rol <span class="sm-req">*</span>
                </label>
                <div class="sm-campo">
                    <i class="ti ti-tag"></i>
                    <input type="text" th:field="*{nombre}" class="sm-input" id="inputNombre"
                        placeholder="Ej: ADMINISTRADOR, SUPERVISOR, OPERADOR…" required maxlength="50"
                        autocomplete="off" />
                    <div class="invalid-feedback">Ingrese el nombre del rol (máx. 50 caracteres).</div>
                </div>
                <div class="sm-ayuda">Se guarda en mayúsculas y no puede repetirse con otro rol activo.</div>
            </div>
        </div>
    </div>

    <div class="sm-modal-pie">
        <span class="sm-nota"><span class="sm-req">*</span> Campo obligatorio</span>
        <button type="button" class="sm-btn sm-btn-neutro" data-bs-dismiss="modal" id="btnCancelarRol">
            <i class="ti ti-x"></i> Cancelar
        </button>
        <button type="submit" class="sm-btn sm-btn-exito" id="btnGuardarRol">
            <i class="ti ti-device-floppy"></i>
            <span th:text="${edit} ? 'Guardar cambios' : 'Registrar rol'">Guardar</span>
        </button>
    </div>
</form>

<script>
    (function () {
        const esEdicion = $('#formularioRol input[name="idRol"]').length > 0;
        const $nombre = $('#inputNombre');

        if (window.sciafContador) sciafContador.simple('#inputNombre', 50);

        // Las mayúsculas las pone la plantilla (SciafModulo.formulario) en todos los campos.
        SciafModulo.formulario({
            form: '#formularioRol',
            modal: '#modalFormularioRol',
            guardar: '#btnGuardarRol',
            cancelar: '#btnCancelarRol',
            textoGuardando: esEdicion ? 'Guardando…' : 'Registrando…',
            msgExito: esEdicion ? 'Rol modificado' : 'Rol registrado'
            // La tabla la recarga la vista (SciafModulo.alGuardarModal en rol/vista.html).
        });

        // Cursor listo para escribir (el modal puede estar ya abierto o terminando de abrirse).
        const $modal = $('#modalFormularioRol');
        if ($modal.hasClass('show')) $nombre.trigger('focus');
        else $modal.one('shown.bs.modal', function () { $nombre.trigger('focus'); });
    })();
</script>
