<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: municipio/tabla_registro.html — municipios.
     · Al abrir llega incluido en municipio/vista.html (th:replace … :: tabla): un pedido.
       POST /administracion/municipio/tabla-registros lo devuelve para recargar.
     · data-predios: cuántos predios usan el municipio (para mostrar y avisar al eliminar).
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle js-tabla-municipios" th:fragment="tabla">
    <thead>
        <tr>
            <th style="width:140px;">Código</th>
            <th>Municipio</th>
            <th style="width:200px;">Predios</th>
            <th class="text-end" style="width:240px;"><span th:if="${esAdmin}">Opciones</span></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="m, it : ${listasMunicipios}"
            th:with="n=${prediosPorMunicipio.get(m.idMunicipio) ?: 0}"
            th:attr="data-predios=${n}">
            <td><span class="sm-codigo sm-mayus" th:text="${m.codigo ?: '—'}"></span></td>
            <td class="sm-nombre" th:text="${m.nombre}"></td>
            <td th:attr="data-order=${n}">
                <span th:if="${n > 0}" class="sm-pastilla sm-pastilla-info py-0">
                    <i class="ti ti-building-estate"></i> <span th:text="${n}"></span></span>
                <span th:if="${n == 0}" class="sm-pastilla py-0">Sin predios</span>
            </td>
            <td class="text-end">
                <div class="sm-acciones" th:if="${esAdmin}" th:attr="data-id=${id_encryptado[it.index]}, data-nombre=${m.nombre}">
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave" data-accion="editar" title="Modificar este municipio">
                        <i class="ti ti-edit"></i> Editar</button>
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro" data-accion="eliminar" title="Eliminar este municipio">
                        <i class="ti ti-trash"></i> Eliminar</button>
                </div>
            </td>
        </tr>
    </tbody>
</table>
