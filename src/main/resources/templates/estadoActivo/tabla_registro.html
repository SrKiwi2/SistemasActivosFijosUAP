<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: estadoActivo/tabla_registro.html — estados del activo.
     · Al abrir llega incluido en estadoActivo/vista.html (th:replace … :: tabla): un pedido.
       POST /administracion/estadoa/tabla-registros lo devuelve para recargar.
     · data-activos: cuántos activos usan el estado (para mostrar y avisar al eliminar).
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle js-tabla-estados" th:fragment="tabla">
    <thead>
        <tr>
            <th style="width:120px;">Código</th>
            <th>Estado</th>
            <th style="width:200px;">Activos con este estado</th>
            <th class="text-end" style="width:240px;">Opciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="e, it : ${listasEstadoActivos}"
            th:with="n=${activosPorEstado.get(e.idEstadoActivo) ?: 0}"
            th:attr="data-activos=${n}">
            <td><span class="sm-codigo sm-mayus" th:text="${e.codigo}"></span></td>
            <td class="sm-nombre" th:text="${e.nombre}"></td>
            <td th:attr="data-order=${n}">
                <span th:if="${n > 0}" class="sm-pastilla sm-pastilla-info py-0">
                    <i class="ti ti-box"></i> <span th:text="${#numbers.formatInteger(n, 1, 'POINT')}"></span></span>
                <span th:if="${n == 0}" class="sm-pastilla py-0">Sin activos</span>
            </td>
            <td class="text-end">
                <div class="sm-acciones" th:attr="data-id=${id_encryptado[it.index]}, data-nombre=${e.nombre}">
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave" data-accion="editar" title="Modificar este estado">
                        <i class="ti ti-edit"></i> Editar</button>
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro" data-accion="eliminar" title="Eliminar este estado">
                        <i class="ti ti-trash"></i> Eliminar</button>
                </div>
            </td>
        </tr>
    </tbody>
</table>
