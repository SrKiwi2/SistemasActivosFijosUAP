<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: estadoActivo/formulario.html  (va dentro de .modal-content.sm-modal)
     El envío lo hace SciafModulo.formulario() y espera JSON { ok, msg }.
     ══════════════════════════════════════════════════════════════ -->
<div class="sm-modal-cab">
    <div class="sm-cabecera-icono">
        <i class="ti" th:classappend="${edit} ? 'ti-edit' : 'ti-badge'"></i>
    </div>
    <div>
        <h5 class="sm-modal-titulo" th:text="${edit} ? 'Modificar estado' : 'Nuevo estado'">Estado del activo</h5>
        <p class="sm-modal-sub">Condición física con que se registra un activo.</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>

<form id="formularioEstadoActivo" method="post"
    th:action="${edit} ? @{/administracion/estadoa/modificar-estadoa} : @{/administracion/estadoa/registrar-estadoa}" novalidate>
    <input type="hidden" th:if="${edit != null}" th:field="${estadoActivo.idEstadoActivo}">

    <div class="sm-modal-cuerpo">
        <div class="sm-seccion">
            <div class="sm-seccion-cab"><i class="ti ti-info-circle"></i> Datos del estado</div>
            <div class="sm-seccion-cuerpo">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="sm-label" for="estCodigo">Código <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <i class="ti ti-hash"></i>
                            <input type="text" th:field="${estadoActivo.codigo}" id="estCodigo" class="sm-input"
                                   placeholder="Ej: B" maxlength="255" required autocomplete="off" />
                            <div class="invalid-feedback">Ingrese el código.</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="sm-label" for="estNombre">Nombre <span class="sm-req">*</span></label>
                        <div class="sm-campo">
                            <i class="ti ti-tag"></i>
                            <input type="text" th:field="${estadoActivo.nombre}" id="estNombre" class="sm-input"
                                   placeholder="Ej: BUENO" maxlength="255" required autocomplete="off" />
                            <div class="invalid-feedback">Ingrese el nombre.</div>
                        </div>
                    </div>
                </div>
                <div class="sm-ayuda mt-2">El código no puede repetirse con otro estado.</div>
            </div>
        </div>
    </div>

    <div class="sm-modal-pie">
        <span class="sm-nota"><span class="sm-req">*</span> Campo obligatorio</span>
        <button type="button" class="sm-btn sm-btn-neutro" data-bs-dismiss="modal" id="btnCancelarEstado">
            <i class="ti ti-x"></i> Cancelar
        </button>
        <button type="submit" class="sm-btn sm-btn-exito" id="btnGuardarEstado">
            <i class="ti ti-device-floppy"></i>
            <span th:text="${edit} ? 'Guardar cambios' : 'Registrar estado'">Guardar</span>
        </button>
    </div>
</form>

<script>
    (function () {
        const esEdicion = $('#formularioEstadoActivo input[name="idEstadoActivo"]').length > 0;
        SciafModulo.formulario({
            form: '#formularioEstadoActivo',
            modal: '#modalFormularioEstadoActivo',
            guardar: '#btnGuardarEstado',
            cancelar: '#btnCancelarEstado',
            textoGuardando: esEdicion ? 'Guardando…' : 'Registrando…',
            msgExito: esEdicion ? 'Estado modificado' : 'Estado registrado'
            // La tabla la recarga la vista (SciafModulo.alGuardarModal).
        });
        const $modal = $('#modalFormularioEstadoActivo');
        const $primero = $('#estCodigo');
        if ($modal.hasClass('show')) $primero.trigger('focus');
        else $modal.one('shown.bs.modal', () => $primero.trigger('focus'));
    })();
</script>
