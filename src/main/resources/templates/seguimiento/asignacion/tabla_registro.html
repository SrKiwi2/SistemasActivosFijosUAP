<!-- Página de actas: el servidor pagina y ordena. No inicializar DataTables sobre estas filas. -->
<div th:fragment="tabla_completa" class="asig-listado"
     th:attr="data-pagina=${paginaActual.number},data-total-paginas=${paginaActual.totalPages},data-tamano=${paginaActual.size}">

    <div th:if="${paginaActual.totalElements == 0}" class="asig-vacio">
        <i class="ti ti-clipboard-off"></i>
        <h3 th:text="${filtros.hayFiltrosActivos() ? 'No hay actas con estos filtros' : 'Todavía no hay actas para mostrar'}">Sin actas</h3>
        <p th:text="${filtros.hayFiltrosActivos() ? 'Cambie la búsqueda o quite algún filtro.' : 'Las actas aparecerán aquí cuando se registren.'}">—</p>
        <button th:if="${filtros.hayFiltrosActivos()}" type="button" class="sm-btn sm-btn-sm sm-btn-suave js-limpiar"><i class="ti ti-filter-x"></i> Limpiar filtros</button>
    </div>

    <div th:if="${paginaActual.totalElements > 0}" class="asig-tabla-area">
        <table class="table sm-tabla asig-tabla" aria-label="Actas de asignación">
            <thead><tr>
                <th><button type="button" class="asig-orden js-ordenar" data-orden="documento">Acta <i th:class="${orden == 'documento' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th class="asig-col-fecha"><button type="button" class="asig-orden js-ordenar" data-orden="fecha">Fecha <i th:class="${orden == 'fecha' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th><button type="button" class="asig-orden js-ordenar" data-orden="responsable">Responsable <i th:class="${orden == 'responsable' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th class="asig-col-oficina"><button type="button" class="asig-orden js-ordenar" data-orden="oficina">Oficina <i th:class="${orden == 'oficina' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th class="asig-col-grupo">Grupo / auxiliar</th>
                <th class="asig-col-bienes text-end"><button type="button" class="asig-orden js-ordenar" data-orden="activos">Bienes <i th:class="${orden == 'activos' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th th:if="${puedeVerFinanzasActivo}" class="asig-col-costo text-end"><button type="button" class="asig-orden js-ordenar" data-orden="costo">Costo <i th:class="${orden == 'costo' ? (desc ? 'ti ti-chevron-down' : 'ti ti-chevron-up') : 'ti ti-selector'}"></i></button></th>
                <th>VSIAF</th><th class="text-end">Detalle</th>
            </tr></thead>
            <tbody>
                <tr th:each="asig : ${asignaciones}" class="asig-row js-ver-acta" tabindex="0"
                    th:with="res=${resumenes.get(asig.idAsignacionActivo)},rub=${rubros.get(asig.idAsignacionActivo)},sinc=${resumenes.get(asig.idAsignacionActivo) != null ? resumenes.get(asig.idAsignacionActivo).etiquetaSincronizacion : 'SIN_DATOS'}"
                    th:attr="data-id-asignacion=${asig.idAsignacionActivo}"
                    th:aria-label="${'Ver detalle de asignación ' + (asig.numeroAsignacion ?: asig.idAsignacionActivo)}">
                    <td class="asig-acta"><strong th:text="${asig.numeroAsignacion ?: 'Sin número'}">—</strong><small th:text="${asig.codigoCompletoNormalizado ?: 'Sin código de documento'}">—</small></td>
                    <td class="asig-fecha asig-col-fecha"><span th:text="${asig.fechaAsignacion != null ? #temporals.format(asig.fechaAsignacion, 'dd/MM/yyyy') : '—'}">—</span></td>
                    <td class="asig-persona">
                        <strong th:text="${asig.responsable != null and asig.responsable.persona != null ? asig.responsable.persona.nombreCompleto : 'Sin responsable'}">—</strong>
                        <small th:if="${asig.responsable != null and asig.responsable.codigoFuncionario != null}" th:text="${'Cód. ' + asig.responsable.codigoFuncionario}">—</small>
                        <small class="asig-oficina-movil" th:if="${asig.oficinaDestino != null}" th:text="${asig.oficinaDestino.nombre}">—</small>
                    </td>
                    <td class="asig-col-oficina asig-oficina" th:text="${asig.oficinaDestino != null ? ((asig.oficinaDestino.codOfi != null ? asig.oficinaDestino.codOfi + ' · ' : '') + asig.oficinaDestino.nombre) : '—'}">—</td>
                    <td class="asig-col-grupo asig-rubro">
                        <span th:if="${rub != null and !rub.isEmpty()}" th:text="${rub.get(0).grupoContable}">—</span>
                        <small th:if="${rub != null and !rub.isEmpty()}" th:text="${rub.get(0).etiqueta() + (rub.size() > 1 ? ' · +' + (rub.size() - 1) + ' rubro(s)' : '')}">—</small>
                        <span th:unless="${rub != null and !rub.isEmpty()}">—</span>
                    </td>
                    <td class="asig-col-bienes text-end asig-bienes" th:text="${res != null ? res.total : 0}">0</td>
                    <td th:if="${puedeVerFinanzasActivo}" class="asig-col-costo text-end asig-costo"
                        th:title="${res != null and res.totalParcial ? 'Total parcial: hay bienes sin costo' : 'Costo del acta'}"
                        th:text="${res != null ? #numbers.formatDecimal(res.costoTotal, 1, 'POINT', 2, 'COMMA') : '—'}">—</td>
                    <td><span class="asig-estado" th:classappend="${' asig-estado-' + sinc.toLowerCase()}"
                              th:text="${sinc == 'COMPLETA' ? 'Completa' : sinc == 'PARCIAL' ? 'Parcial' : sinc == 'ERROR' ? 'Error' : sinc == 'SIN_SUBIR' ? 'Sin subir' : 'Sin datos'}">—</span></td>
                    <td class="text-end asig-acciones"><button type="button" class="sm-btn sm-btn-sm sm-btn-suave js-ver-acta" th:attr="data-id-asignacion=${asig.idAsignacionActivo}"
                            th:aria-label="${'Ver detalle del acta ' + (asig.numeroAsignacion ?: asig.idAsignacionActivo)}"><i class="ti ti-eye"></i><span> Ver</span></button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer th:if="${paginaActual.totalElements > 0}" class="asig-paginador">
        <span class="asig-rango" th:with="primera=${paginaActual.number * paginaActual.size + 1},ultima=${primera + paginaActual.numberOfElements - 1}"
              th:text="${primera + '–' + ultima + ' de ' + paginaActual.totalElements + ' actas'}">1–5 de 66 actas</span>
        <nav th:if="${paginaActual.totalPages > 1}" aria-label="Páginas de actas" class="asig-paginas">
            <button type="button" class="js-pagina" th:attr="data-pagina=${paginaActual.number - 1}" th:disabled="${paginaActual.first}" aria-label="Página anterior"><i class="ti ti-chevron-left"></i></button>
            <button type="button" th:each="p : ${paginasVisibles}" class="js-pagina asig-pagina-num"
                    th:classappend="${p == paginaActual.number} ? ' actual'" th:attr="data-pagina=${p},aria-current=${p == paginaActual.number ? 'page' : null}" th:text="${p + 1}">1</button>
            <button type="button" class="js-pagina" th:attr="data-pagina=${paginaActual.number + 1}" th:disabled="${paginaActual.last}" aria-label="Página siguiente"><i class="ti ti-chevron-right"></i></button>
        </nav>
        <span class="asig-pagina-texto" th:text="${'Página ' + (paginaActual.number + 1) + ' de ' + paginaActual.totalPages}">Página 1 de 1</span>
    </footer>
</div>
