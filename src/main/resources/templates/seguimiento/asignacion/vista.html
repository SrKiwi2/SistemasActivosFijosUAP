<!-- ═══════════════════════════════════════════════════════════════
     PANTALLA: Asignación de Activos — plantilla de mantenimiento (sm-*)
     Estilos: /assets/css/sciaf-modulo.css · Comportamiento: /assets/js/sciaf-modulo.js
     Guía: docs/PLANTILLA_MODULOS.md

     Todo vive dentro de #modAsignacion y el script no deja funciones globales.
     La barra (buscador / filas) vive aquí y no en el fragmento de la tabla:
     así sobrevive a cada recarga sin perder lo que el usuario escribió.
     ═══════════════════════════════════════════════════════════════ -->
<div class="sm-pagina" id="modAsignacion">

<header class="sm-cabecera">
    <div class="sm-cabecera-icono"><i class="ti ti-clipboard"></i></div>
    <div class="sm-cabecera-texto">
        <nav class="sm-migas" aria-label="Ubicación">
            <i class="ti ti-route"></i> Seguimiento <i class="ti ti-chevron-right"></i> Asignación de Activos
        </nav>
        <h1 class="sm-titulo">Asignación de Activos</h1>
        <p class="sm-subtitulo">Actas de asignación, reasignación y devolución de bienes.</p>
    </div>
    <div class="sm-cabecera-acciones">
        <button type="button" class="sm-btn js-nueva-acta" title="Crear acta desde Activos pendientes">
            <i class="ti ti-plus"></i> Nueva acta
        </button>
    </div>
</header>

<section class="sm-card">
    <div class="sm-toolbar">
        <div class="sm-buscador">
            <i class="ti ti-search"></i>
            <input type="text" class="sm-input js-buscar" placeholder="Buscar N° acta, documento, responsable, código de bien…" autocomplete="off" aria-label="Buscar acta">
            <button type="button" class="sm-buscador-limpiar" title="Limpiar búsqueda (Esc)"><i class="ti ti-x"></i></button>
        </div>

        <!-- Filtros exactos (reemplazan filtros por columna en thead) -->
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-sinc" aria-label="Estado en VSIAF">
                <option value="SUBIDAS">Subidas (todas)</option>
                <option value="COMPLETAS">Solo completas</option>
                <option value="PARCIALES">Solo parciales</option>
                <option value="TODAS">Incluir no subidas</option>
            </select>
        </div>
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-gestion" aria-label="Gestión">
                <option value="">Todas las gestiones</option>
                <option th:each="g : ${gestiones}" th:value="${g}" th:text="${g}">2026</option>
            </select>
        </div>
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-mes" aria-label="Mes">
                <option value="">Todos los meses</option>
                <option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option>
                <option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option>
                <option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option>
                <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
        </div>
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-tipo" aria-label="Tipo de acta">
                <option value="">Todos los tipos</option>
                <option value="NUEVA">Nueva</option>
                <option value="REASIGNACION">Reasignación</option>
                <option value="DEVOLUCION">Devolución</option>
            </select>
        </div>
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-estado" aria-label="Estado del acta">
                <option value="">Todos los estados</option>
                <option value="ACTIVA">Activa</option>
                <option value="ANULADA">Anulada</option>
                <option value="DEVUELTA">Devuelta</option>
            </select>
        </div>
        <div class="sm-toolbar-filtro">
            <select class="sm-select js-filtro-grupo" aria-label="Grupo contable">
                <option value="">Todos los grupos</option>
                <option th:each="g : ${gruposContables}" th:value="${g.idGrupoContable}" th:text="${g.nombre}">Muebles</option>
            </select>
        </div>

        <div class="sm-toolbar-filtro" style="max-width:160px">
            <input type="date" class="sm-input js-filtro-desde" placeholder="Desde" aria-label="Fecha desde">
        </div>
        <div class="sm-toolbar-filtro" style="max-width:160px">
            <input type="date" class="sm-input js-filtro-hasta" placeholder="Hasta" aria-label="Fecha hasta">
        </div>

        <div class="sm-toolbar-filtro">
            <label class="form-check form-switch m-0">
                <input class="form-check-input js-filtro-error" type="checkbox" aria-label="Solo con error VSIAF">
                <span class="form-check-label small ms-1">Solo error VSIAF</span>
            </label>
        </div>

        <div class="sm-toolbar-espacio"></div>

        <label class="sm-filas">
            <i class="ti ti-list-numbers"></i> Filas
            <select class="sm-select js-largo" aria-label="Filas por página">
                <option value="auto" selected>Ajustar a pantalla</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="-1">Todas</option>
            </select>
        </label>

        <div class="d-flex gap-1">
            <button type="button" class="sm-btn sm-btn-sm sm-btn-neutro js-limpiar" title="Limpiar filtros">
                <i class="ti ti-filter-x"></i> Limpiar
            </button>
            <button type="button" class="sm-btn sm-btn-sm sm-btn-neutro js-actualizar" title="Actualizar">
                <i class="ti ti-refresh"></i> Actualizar
            </button>
            <button type="button" class="sm-btn sm-btn-sm sm-btn-exito js-exportar" title="Exportar a Excel">
                <i class="ti ti-file-spreadsheet"></i> Excel
            </button>
        </div>
    </div>

    <!-- Contenedor de la tabla: el fragmento tabla_registro se carga aquí -->
    <div class="js-tabla"></div>
</section>

<!-- ======================= MODALES (fragmentos separados) ======================= -->
<!-- Cada modal se carga por AJAX cuando se necesita; aquí solo el contenedor vacío -->

<!-- Modal DETALLE DE ACTA (multi-tab) -->
<div class="modal fade" id="modalDetalleAsignacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content sm-modal" id="contenidoModalDetalle"></div>
    </div>
</div>

<!-- Modal VER DETALLE ACTIVO (solo lectura) -->
<div class="modal fade" id="modalVerDetalleActivo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalVerDetalle"></div>
    </div>
</div>

<!-- Modal CORREGIR ACTIVO -->
<div class="modal fade" id="modalCorregirActivo" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalCorregir"></div>
    </div>
</div>

<!-- Modal SEPARAR ACTA -->
<div class="modal fade" id="modalSepararActa" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalSeparar"></div>
    </div>
</div>

<!-- Modal TRASLADAR -->
<div class="modal fade" id="modalTrasladar" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalTrasladar"></div>
    </div>
</div>

<!-- Modal INCORPORAR -->
<div class="modal fade" id="modalIncorporar" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalIncorporar"></div>
    </div>
</div>

<!-- Modal EDITAR CABECERA -->
<div class="modal fade" id="modalEditarCabecera" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content sm-modal" id="contenidoModalEditarCabecera"></div>
    </div>
</div>

<!-- Modal EDITAR REPORTE -->
<div class="modal fade" id="modalEditarReporte" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content sm-modal" id="contenidoModalEditarReporte"></div>
    </div>
</div>

</div>

<script>
    (function () {
        const URL = '/administracion/asignacion';
        const $raiz = $('#modAsignacion');
        const $cont = $raiz.find('.js-tabla');
        const $modalDetalle = $raiz.find('#modalDetalleAsignacion');
        const $contenidoDetalle = $raiz.find('#contenidoModalDetalle');

        // Referencias a los otros modales (se usan desde el detalle)
        const modales = {
            verDetalle: { modal: $raiz.find('#modalVerDetalleActivo'), cont: $raiz.find('#contenidoModalVerDetalle') },
            corregir:   { modal: $raiz.find('#modalCorregirActivo'),   cont: $raiz.find('#contenidoModalCorregir') },
            separar:    { modal: $raiz.find('#modalSepararActa'),    cont: $raiz.find('#contenidoModalSeparar') },
            trasladar:  { modal: $raiz.find('#modalTrasladar'),      cont: $raiz.find('#contenidoModalTrasladar') },
            incorporar: { modal: $raiz.find('#modalIncorporar'),     cont: $raiz.find('#contenidoModalIncorporar') },
            editarCab:  { modal: $raiz.find('#modalEditarCabecera'), cont: $raiz.find('#contenidoModalEditarCabecera') },
            editarRep:  { modal: $raiz.find('#modalEditarReporte'),  cont: $raiz.find('#contenidoModalEditarReporte') }
        };

        // Estado de la tabla (orden, página, tamaño) — var para re-entrada por AJAX
        var estadoTabla = { orden: 'fecha', desc: true, pagina: 0, tamano: 25 };
        var ORDEN_DESC_PRIMERO = ['fecha', 'activos', 'costo'];
        var temporizadorBusqueda = null;
        var _asigActual = null;
        var _cabeceraActual = null;

        $(document).ready(function () {
            restaurarDesdeUrl();
            inicializarFiltros();
            cargarTabla();
        });

        // ═══════════════════════════════════════════════════════════════
        // TABLA — SciafModulo.tabla() en modo CLIENT-SIDE sobre HTML del servidor
        // ═══════════════════════════════════════════════════════════════
        function iniciarTabla() {
            const $table = $cont.find('table');
            if (!$table.length) return;

            SciafModulo.tabla({
                tabla: $table,
                buscador: $raiz.find('.js-buscar'),
                largo: $raiz.find('.js-largo'),
                filtros: [
                    { selector: $raiz.find('.js-filtro-sinc'),   columna: 7 },
                    { selector: $raiz.find('.js-filtro-gestion'), columna: -1 },
                    { selector: $raiz.find('.js-filtro-mes'),    columna: -1 },
                    { selector: $raiz.find('.js-filtro-tipo'),   columna: -1 },
                    { selector: $raiz.find('.js-filtro-estado'), columna: -1 },
                    { selector: $raiz.find('.js-filtro-grupo'),  columna: -1 },
                    { selector: $raiz.find('.js-filtro-desde'),  columna: -1 },
                    { selector: $raiz.find('.js-filtro-hasta'),  columna: -1 },
                    { selector: $raiz.find('.js-filtro-error'),  columna: -1 }
                ],
                orden: [ [1, 'desc'] ],
                noOrdenables: [8],
            });

            // Click en fila → abrir detalle
            $cont.off('click.asigRow').on('click.asigRow', '.asig-row', function (e) {
                if ($(e.target).closest('a, button, .btn, .chk-bien, #chk-todos').length) return;
                const id = $(this).data('idAsignacionActivo');
                if (id) abrirModalDetalle(id);
            });

            // Checkboxes de selección (para barra de acciones en el modal detalle)
            $cont.off('change.selBien').on('change.selBien', '.chk-bien', actualizarBarraSeleccion);
            $cont.off('change.selTodos').on('change.selTodos', '#chk-todos', function () {
                $cont.find('.chk-bien').prop('checked', this.checked);
                actualizarBarraSeleccion();
            });
        }

        // ═══════════════════════════════════════════════════════════════
        // CARGAR TABLA — usa SciafPrecarga + SciafModulo.cargar (HTML fragment)
        // ═══════════════════════════════════════════════════════════════
        function cargarTabla(reiniciarPagina) {
            if (reiniciarPagina) estadoTabla.pagina = 0;

            const params = Object.assign({}, obtenerParametrosFiltro(), estadoTabla);
            sincronizarUrl(obtenerParametrosFiltro());

            const api = $cont.find('table').DataTable();
            if (api) {
                // Recarga: atenuar tabla actual, cargar HTML nuevo, reinicializar
                $cont.css('opacity', 0.55);
                SciafModulo.cargar($cont, URL + '/tabla-registros-fragment', params)
                    .then(function () {
                        $cont.css('opacity', 1);
                        iniciarTabla();
                    })
                    .catch(function (e) {
                        $cont.css('opacity', 1);
                        SciafModulo.avisarError(e, 'No se pudo recargar');
                    });
            } else {
                // Primera carga: preloader dentro de la tarjeta
                SciafPrecarga.durante($cont, SciafModulo.cargar($cont, URL + '/tabla-registros-fragment', params), {
                    texto: 'Cargando actas…',
                    tituloError: 'No se pudo cargar la tabla',
                    alReintentar: () => cargarTabla(true)
                }).then(iniciarTabla).catch(() => {});
            }
        }

        function obtenerParametrosFiltro() {
            return {
                buscar: $raiz.find('.js-buscar').val() || '',
                sincronizacion: $raiz.find('.js-filtro-sinc').val() || 'SUBIDAS',
                gestion: $raiz.find('.js-filtro-gestion').val() || '',
                mes: $raiz.find('.js-filtro-mes').val() || '',
                tipo: $raiz.find('.js-filtro-tipo').val() || '',
                estado: $raiz.find('.js-filtro-estado').val() || '',
                idGrupoContable: $raiz.find('.js-filtro-grupo').val() || '',
                desde: $raiz.find('.js-filtro-desde').val() || '',
                hasta: $raiz.find('.js-filtro-hasta').val() || '',
                soloConError: $raiz.find('.js-filtro-error').is(':checked')
            };
        }

        // ═══════════════════════════════════════════════════════════════
        // EXPORTAR EXCEL (mismo filtro + orden actual)
        // ═══════════════════════════════════════════════════════════════
        $raiz.on('click', '.js-exportar', function () {
            const params = Object.assign({}, obtenerParametrosFiltro(), {
                orden: estadoTabla.orden,
                desc: estadoTabla.desc
            });
            window.location.href = URL + '/exportar-excel?' + $.param(params);
        });

        // ═══════════════════════════════════════════════════════════════
        // ORDEN / PAGINACIÓN / TAMAÑO (llamados desde la tabla/paginador)
        // ═══════════════════════════════════════════════════════════════
        window.ordenarPor = function (columna) {
            if (estadoTabla.orden === columna) {
                estadoTabla.desc = !estadoTabla.desc;
            } else {
                estadoTabla.orden = columna;
                estadoTabla.desc = ORDEN_DESC_PRIMERO.includes(columna);
            }
            estadoTabla.pagina = 0;
            cargarTabla();
        };
        window.irAPagina = function (n) {
            if (n < 0) return;
            estadoTabla.pagina = n;
            cargarTabla();
        };
        window.cambiarTamano = function (n) {
            estadoTabla.tamano = parseInt(n, 10) || 25;
            estadoTabla.pagina = 0;
            cargarTabla();
        };

        // ═══════════════════════════════════════════════════════════════
        // FILTROS (debounce en buscador, cambio inmediato en selects)
        // ═══════════════════════════════════════════════════════════════
        function inicializarFiltros() {
            $raiz.find('.js-buscar').on('input', function () {
                clearTimeout(temporizadorBusqueda);
                temporizadorBusqueda = setTimeout(() => cargarTabla(true), 350);
            }).on('keypress', function (e) {
                if (e.which === 13) { clearTimeout(temporizadorBusqueda); cargarTabla(true); }
            });
            $raiz.find('.js-filtro-sinc, .js-filtro-gestion, .js-filtro-mes, .js-filtro-tipo, .js-filtro-estado, .js-filtro-grupo, .js-filtro-desde, .js-filtro-hasta, .js-filtro-error')
                .on('change', function () { cargarTabla(true); });
        }

        $raiz.on('click', '.js-limpiar', function () {
            $raiz.find('.js-buscar, .js-filtro-desde, .js-filtro-hasta').val('');
            $raiz.find('.js-filtro-sinc').val('SUBIDAS');
            $raiz.find('.js-filtro-gestion, .js-filtro-mes, .js-filtro-tipo, .js-filtro-estado, .js-filtro-grupo').val('');
            $raiz.find('.js-filtro-error').prop('checked', false);
            cargarTabla(true);
        });
        $raiz.on('click', '.js-actualizar', function () { cargarTabla(); });

        // Chips de filtros activos (se inyectan desde el servidor en tabla_registro)
        window.quitarFiltro = function (cual) {
            switch (cual) {
                case 'buscar':         $raiz.find('.js-buscar').val(''); break;
                case 'sincronizacion': $raiz.find('.js-filtro-sinc').val('SUBIDAS'); break;
                case 'soloConError':   $raiz.find('.js-filtro-error').prop('checked', false); break;
                case 'gestion':        $raiz.find('.js-filtro-gestion').val(''); break;
                case 'tipo':           $raiz.find('.js-filtro-tipo').val(''); break;
                case 'estado':         $raiz.find('.js-filtro-estado').val(''); break;
                case 'fechas':         $raiz.find('.js-filtro-desde, .js-filtro-hasta').val(''); break;
                case 'mes':            $raiz.find('.js-filtro-mes').val(''); break;
                case 'idGrupoContable':$raiz.find('.js-filtro-grupo').val(''); break;
            }
            cargarTabla(true);
        };
        window.filtrarPorSincronizacion = function (valor) {
            $raiz.find('.js-filtro-sinc').val(valor);
            $raiz.find('.js-filtro-error').prop('checked', false);
            cargarTabla(true);
        };
        window.filtrarSoloConError = function () {
            $raiz.find('.js-filtro-error').prop('checked', true);
            cargarTabla(true);
        };

        // ═══════════════════════════════════════════════════════════════
        // URL STATE (persistir filtros en la URL)
        // ═══════════════════════════════════════════════════════════════
        function sincronizarUrl(filtros) {
            const q = new URLSearchParams();
            Object.entries(filtros).forEach(([k, v]) => {
                if (v === '' || v === false || v == null) return;
                if (k === 'sincronizacion' && v === 'SUBIDAS') return;
                q.set(k, v);
            });
            history.replaceState(null, '', q.toString() ? '?' + q.toString() : location.pathname);
        }
        function restaurarDesdeUrl() {
            const q = new URLSearchParams(location.search);
            const map = {
                buscar: '.js-buscar', desde: '.js-filtro-desde', hasta: '.js-filtro-hasta',
                tipo: '.js-filtro-tipo', estado: '.js-filtro-estado', gestion: '.js-filtro-gestion',
                mes: '.js-filtro-mes', idGrupoContable: '.js-filtro-grupo', sincronizacion: '.js-filtro-sinc'
            };
            Object.entries(map).forEach(([param, sel]) => { if (q.has(param)) $raiz.find(sel).val(q.get(param)); });
            if (q.get('soloConError') === 'true') $raiz.find('.js-filtro-error').prop('checked', true);
        }

        // ═══════════════════════════════════════════════════════════════
        // MODAL DETALLE DE ACTA (carga fragmento detalle_asignacion.html)
        // ═══════════════════════════════════════════════════════════════
        function abrirModalDetalle(id) {
            _asigActual = id;
            // Primero obtener datos JSON, LUEGO cargar fragmento (para que el script del fragmento encuentre los datos)
            SciafModulo.pedirJson(URL + '/asignaciones/' + id + '/detalles-json')
                .then(function (resp) {
                    if (!resp.ok) throw new Error(resp.msg || 'Error cargando detalle');
                    window._detalleActaData = {
                        cabecera: resp.cabecera,
                        detalles: resp.detalles,
                        resumen: resp.resumen,
                        puedeEditar: resp.puedeEditar,
                        historial: resp.historial
                    };
                    // Ahora cargar el fragmento (su script leerá window._detalleActaData)
                    return SciafModulo.abrirFormulario($modalDetalle, $contenidoDetalle, URL + '/asignaciones/' + id + '/detalle-fragment');
                })
                .catch(function (e) {
                    SciafModulo.avisarError(e, 'No se pudo abrir el detalle');
                });
        }

        // Al cerrar el modal detalle, limpiar referencia
        $modalDetalle.on('hidden.bs.modal', function () { _asigActual = null; _cabeceraActual = null; });

        // Exponer funciones que usan los modales hijos (se llaman desde los fragmentos cargados)
        window._getAsigActual = () => _asigActual;
        window._getCabeceraActual = () => _cabeceraActual;
        window._setCabeceraActual = (c) => { _cabeceraActual = c; };
        window._recargarTabla = () => cargarTabla();
        window._cerrarModalDetalle = () => bootstrap.Modal.getInstance($modalDetalle[0])?.hide();

        // Barra de selección (checkboxes en tabla del modal detalle)
        window.actualizarBarraSeleccion = function () {
            const n = $cont.find('.chk-bien:checked').length;
            $('#sel-cantidad').text(n);
            $('#barra-seleccion').toggleClass('d-none', n === 0).toggleClass('d-flex', n > 0);
            const total = $cont.find('.chk-bien').length;
            $('#chk-todos').prop('checked', n > 0 && n === total).prop('indeterminate', n > 0 && n < total);
        };
        window.limpiarSeleccion = function () {
            $cont.find('.chk-bien, #chk-todos').prop('checked', false);
            $('#chk-todos').prop('indeterminate', false);
            actualizarBarraSeleccion();
        };

        // Auto-refresco por SSE
        if (window.registrarTablaSse) window.registrarTablaSse('asignacion', cargarTabla);

    })();
</script>
