<!-- El fragmento contiene solo la tabla; la barra y los estilos viven en vista.html. -->
<div class="table-responsive">
        <table class="table sm-tabla align-middle tabla-transferencias" id="tabla-transferencias">
            <thead>
                <tr>
                    <th>TRANSFERENCIA</th>
                    <th>FECHA</th>
                    <th class="text-center">TIPO</th>
                    <th>RESPONSABLE ORIGEN → DESTINO</th>
                    <th>OFICINA DESTINO</th>
                    <th class="text-end">ACTIVOS</th>
                    <th class="text-center">ESTADO</th>
                    <th class="text-end" style="width:90px">ACCIONES</th>
                </tr>
            </thead>

            <tbody>
            <th:block th:each="trf : ${transferencias}">
                <tr th:id="'trf-row-' + ${trf.idTransferencia}"
                    class="trf-row"
                    tabindex="0" role="button"
                    th:aria-label="${'Ver detalle de transferencia ' + (trf.numeroTransferencia ?: trf.idTransferencia)}"
                    th:with="motivo=${trf.motivoFaltante}"
                    th:classappend="${motivo == 'FALTANTE'} ? 'trf-faltante' : (${motivo == 'DEVOLUCION_FALTANTE'} ? 'trf-devolucion' : '')"
                    th:data-id="${trf.idTransferencia}"
                    th:data-numero="${trf.numeroTransferencia}"
                    th:data-tipo="${trf.tipo}"
                    th:data-motivo="${motivo}"
                    th:data-estado="${trf.estadoProceso}"
                    th:data-fecha="${trf.fechaTransferencia}"
                    th:data-fecha-recepcion="${trf.fechaRecepcion}"
                    th:data-resp-origen="${trf.responsableOrigen != null and trf.responsableOrigen.persona != null
                        ? trf.responsableOrigen.persona.nombreCompleto : ''}"
                    th:data-resp-origen-cod="${trf.responsableOrigen != null ? trf.responsableOrigen.codigoFuncionario : ''}"
                    th:data-resp-destino="${trf.responsableDestino != null and trf.responsableDestino.persona != null
                        ? trf.responsableDestino.persona.nombreCompleto : ''}"
                    th:data-resp-destino-cod="${trf.responsableDestino != null ? trf.responsableDestino.codigoFuncionario : ''}"
                    th:data-oficina-origen="${trf.oficinaOrigen != null ? trf.oficinaOrigen.nombre : ''}"
                    th:data-oficina-origen-cod="${trf.oficinaOrigen != null ? trf.oficinaOrigen.codOfi : ''}"
                    th:data-predio-origen="${trf.oficinaOrigen != null and trf.oficinaOrigen.predio != null
                        ? trf.oficinaOrigen.predio.descrip : ''}"
                    th:data-oficina-destino="${trf.oficinaDestino != null ? trf.oficinaDestino.nombre : ''}"
                    th:data-oficina-destino-cod="${trf.oficinaDestino != null ? trf.oficinaDestino.codOfi : ''}"
                    th:data-predio-destino="${trf.oficinaDestino != null and trf.oficinaDestino.predio != null
                        ? trf.oficinaDestino.predio.descrip : ''}"
                    th:data-institucion="${trf.institucionDestino}"
                    th:data-doc-ref="${trf.documentoReferencia}"
                    th:data-observacion="${trf.observacion}"
                    th:data-num-activos="${trf.detalles != null ? #lists.size(trf.detalles) : 0}"
                    th:data-fecha-reg="${trf.registro}"
                    th:data-usuario-reg="${trf.registroIdUsuario != null and mapaUsuarios.containsKey(trf.registroIdUsuario)
                        ? mapaUsuarios.get(trf.registroIdUsuario) : 'Sistema'}"
                    th:data-fecha-mod="${trf.modificacion}"
                    th:data-usuario-mod="${trf.modificacionIdUsuario != null and mapaUsuarios.containsKey(trf.modificacionIdUsuario)
                        ? mapaUsuarios.get(trf.modificacionIdUsuario) : ''}">

                    <!-- Número y documento de referencia -->
                    <td>
                        <div class="fw-semibold text-primary" style="font-size:.85rem"
                             th:text="${trf.numeroTransferencia ?: 'Sin número'}">—</div>
                        <div class="text-muted" style="font-size:.72rem">
                            <span th:text="${trf.documentoReferencia ?: 'sin doc. referencia'}">—</span>
                            <span class="opacity-50" th:text="'· #' + ${trf.idTransferencia}">· #0</span>
                        </div>
                    </td>

                    <!-- Fecha de transferencia y de recepción -->
                    <td th:attr="data-order=${trf.fechaTransferencia}">
                        <div class="small" th:text="${trf.fechaTransferencia != null
                             ? #temporals.format(trf.fechaTransferencia, 'dd/MM/yyyy') : '—'}">—</div>
                        <div class="text-muted" style="font-size:.72rem" th:if="${trf.fechaRecepcion != null}"
                             th:text="'recibido ' + ${#temporals.format(trf.fechaRecepcion, 'dd/MM/yyyy')}">—</div>
                    </td>

                    <!-- Tipo (y, si corresponde, el motivo de faltante: va en rojo para que
                         nadie la confunda con una transferencia común) -->
                    <td class="text-center">
                        <span class="badge"
                              th:classappend="${trf.tipo == 'INTERNA'} ? 'bg-info' : 'bg-warning text-dark'"
                              th:text="${trf.tipo ?: '—'}">—</span>
                        <span th:if="${motivo == 'FALTANTE'}" class="badge bg-danger d-block mt-1 badge-faltante"
                              title="El bien se envió a la oficina de faltantes del predio por un acta de faltantes">
                            <i class="bx bx-error-circle"></i> FALTANTE
                        </span>
                        <span th:if="${motivo == 'DEVOLUCION_FALTANTE'}" class="badge badge-devolucion d-block mt-1"
                              title="El faltante apareció y el bien salió de la custodia de faltantes">
                            <i class="bx bx-undo"></i> FALTANTE DEVUELTO
                        </span>
                    </td>

                    <!-- Responsable origen → destino -->
                    <td>
                        <div class="d-flex align-items-center gap-1 small">
                            <span class="text-truncate text-muted" style="max-width:170px"
                                  th:text="${trf.responsableOrigen != null and trf.responsableOrigen.persona != null
                                            ? (trf.responsableOrigen.codigoFuncionario != null ? trf.responsableOrigen.codigoFuncionario + ' — ' : '')
                                              + trf.responsableOrigen.persona.nombreCompleto : '—'}">—</span>
                            <i class="bx bx-right-arrow-alt text-muted flex-shrink-0"></i>
                            <span class="text-truncate fw-semibold" style="max-width:170px"
                                  th:text="${trf.responsableDestino != null and trf.responsableDestino.persona != null
                                            ? (trf.responsableDestino.codigoFuncionario != null ? trf.responsableDestino.codigoFuncionario + ' — ' : '')
                                              + trf.responsableDestino.persona.nombreCompleto : '—'}">—</span>
                        </div>
                    </td>

                    <!-- Oficina destino, con su código: así se la identifica en el VSIAF -->
                    <td>
                        <span th:if="${trf.oficinaDestino != null}" class="small d-inline-block text-truncate" style="max-width:190px"
                              th:text="${(trf.oficinaDestino.codOfi != null ? trf.oficinaDestino.codOfi + ' — ' : '') + trf.oficinaDestino.nombre}">—</span>
                        <div th:unless="${trf.oficinaDestino != null}" class="small text-muted text-truncate"
                             style="max-width:190px"
                             th:text="${trf.institucionDestino ?: '—'}">—</div>
                    </td>

                    <!-- Cantidad de activos -->
                    <td class="text-end num" th:text="${trf.detalles != null ? #lists.size(trf.detalles) : 0}">0</td>

                    <!-- Estado del proceso -->
                    <td class="text-center">
                        <span class="badge" th:classappend="${trf.estadoProceso == 'COMPLETADA'} ? 'bg-success' :
                                (${trf.estadoProceso == 'PENDIENTE'} ? 'bg-secondary' :
                                (${trf.estadoProceso == 'EN_PROCESO'} ? 'bg-warning text-dark' : 'bg-danger'))"
                              th:text="${trf.estadoProceso ?: '—'}">—</span>
                    </td>

                    <!-- Acciones -->
                    <td class="text-end text-nowrap">
                        <a th:href="@{/seguimiento-activo/transferencia/{id}/pdf(id=${trf.idTransferencia})}"
                           target="_blank" rel="noopener" class="sm-btn sm-btn-sm sm-btn-suave trf-descargar"
                           title="Descargar Word" aria-label="Descargar Word">
                            <i class="ti ti-file-download"></i>
                        </a>
                        <i class="bx bx-chevron-right text-muted ms-1" title="Ver detalle"></i>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
