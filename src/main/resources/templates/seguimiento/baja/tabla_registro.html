<!-- /seguimiento/baja/tabla_registro.html  —  fragmento de lista de bajas (entidad real BajaActivo) -->

<div th:if="${#lists.isEmpty(bajas)}" class="card border-0 shadow-sm">
    <div class="card-body text-center py-5">
        <i class="bx bx-trash fs-1 text-muted mb-3 d-block"></i>
        <h6 class="text-muted">No se encontraron registros de baja de activos</h6>
    </div>
</div>

<div th:if="${!#lists.isEmpty(bajas)}" class="card border-0 shadow-sm">

    <div class="card-header bg-transparent border-bottom d-flex align-items-center justify-content-between py-3">
        <div class="d-flex align-items-center gap-2">
            <i class="bx bx-trash text-danger fs-5"></i>
            <span class="fw-semibold">Registros de Baja de Activos</span>
            <span class="badge bg-danger rounded-pill" th:text="${#lists.size(bajas)}">0</span>
        </div>
    </div>

    <div class="d-none d-lg-block px-3 pt-2 pb-1">
        <div class="row g-0 text-muted small fw-semibold border-bottom pb-2">
            <div class="col-lg-2">N° DOCUMENTO</div>
            <div class="col-lg-2">FECHA</div>
            <div class="col-lg-2">MOTIVO</div>
            <div class="col-lg-3">ACTIVO</div>
            <div class="col-lg-2">RESPONSABLE</div>
            <div class="col-lg-1 text-center">INFORME</div>
        </div>
    </div>

    <div class="list-group list-group-flush">
        <div th:each="baja : ${bajas}" th:id="'baja-row-' + ${baja.idBajaActivo}"
            th:with="motivoLabel=${baja.causa == 'ROBO' ? 'Robo' : (baja.causa == 'EXTRAVIO' ? 'Extravío' : (baja.causa == 'DANADO' ? 'Dañado' : (baja.causa == 'FIN_VIDA_UTIL' ? 'Cumplió vida útil' : baja.causa)))}"
            class="baja-row list-group-item list-group-item-action px-3 py-0 border-start border-4 border-danger"
            th:data-id="${baja.idBajaActivo}"
            th:data-numero="${baja.hr}"
            th:data-motivo="${motivoLabel}"
            th:data-fecha="${baja.fechaBaja}"
            th:data-codigo="${baja.activo != null ? baja.activo.codigo : ''}"
            th:data-activo="${baja.activo != null ? baja.activo.descripcion : ''}"
            th:data-responsable="${baja.responsable != null and baja.responsable.persona != null ? baja.responsable.persona.nombreCompleto : ''}"
            th:data-oficina="${baja.responsable != null and baja.responsable.oficina != null ? baja.responsable.oficina.nombre : ''}"
            th:data-descripcion="${baja.descripcion}"
            th:data-informe="${baja.informePath}"
            th:data-informe-nombre="${baja.informeNombre}"
            th:data-fecha-reg="${baja.registro != null ? #dates.format(baja.registro, 'dd/MM/yyyy HH:mm') : ''}"
            th:data-usuario-reg="${baja.registroIdUsuario}"
            style="cursor:pointer; transition:background 0.15s">

            <div class="row g-0 align-items-center py-3">
                <!-- N° Documento -->
                <div class="col-12 col-lg-2 mb-1 mb-lg-0">
                    <div class="d-flex align-items-center gap-2">
                        <div class="avatar avatar-xs bg-label-danger rounded">
                            <i class="bx bx-trash small"></i>
                        </div>
                        <div class="fw-semibold text-danger small" th:text="${baja.hr ?: '—'}">—</div>
                    </div>
                </div>

                <!-- Fecha -->
                <div class="col-6 col-lg-2 mb-1 mb-lg-0">
                    <div class="text-muted small">
                        <i class="bx bx-calendar me-1"></i>
                        <span th:text="${baja.fechaBaja ?: '—'}">—</span>
                    </div>
                </div>

                <!-- Motivo -->
                <div class="col-6 col-lg-2 mb-1 mb-lg-0">
                    <span class="badge bg-label-danger" th:text="${motivoLabel ?: '—'}">—</span>
                </div>

                <!-- Activo -->
                <div class="col-12 col-lg-3 mb-1 mb-lg-0">
                    <div class="small">
                        <code class="text-primary" th:text="${baja.activo != null ? baja.activo.codigo : '—'}">—</code>
                    </div>
                    <div class="small text-muted text-truncate" style="max-width:260px"
                         th:text="${baja.activo != null ? baja.activo.descripcion : ''}"></div>
                </div>

                <!-- Responsable -->
                <div class="col-9 col-lg-2 mb-1 mb-lg-0">
                    <div class="d-flex align-items-center gap-2" th:if="${baja.responsable != null and baja.responsable.persona != null}">
                        <i class="bx bx-user text-muted small"></i>
                        <span class="small text-truncate" style="max-width:160px"
                            th:text="${baja.responsable.persona.nombreCompleto}">—</span>
                    </div>
                    <span th:unless="${baja.responsable != null and baja.responsable.persona != null}" class="text-muted small">—</span>
                </div>

                <!-- Informe -->
                <div class="col-3 col-lg-1 text-lg-center d-flex align-items-center justify-content-end justify-content-lg-center gap-2">
                    <a th:if="${baja.informePath != null}" th:href="${baja.informePath}" target="_blank"
                        class="btn btn-sm btn-icon btn-outline-danger py-0 px-1" onclick="event.stopPropagation()"
                        title="Ver informe adjunto"><i class="bx bxs-file-pdf small"></i></a>
                    <span th:unless="${baja.informePath != null}" class="text-muted small" title="Sin informe">—</span>
                    <i class="bx bx-chevron-right text-muted ms-1"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="card-footer bg-transparent border-top d-flex align-items-center py-2 px-3">
        <small class="text-muted">
            <i class="bx bx-info-circle me-1"></i>
            Mostrando <strong th:text="${#lists.size(bajas)}">0</strong> registros. Haz clic para ver el detalle.
        </small>
    </div>
</div>

<style>
    .baja-row:hover {
        background-color: rgba(var(--bs-danger-rgb), 0.04) !important;
    }
</style>
<script>
    $(document).off('click.bajaRow').on('click.bajaRow', '.baja-row', function () {
        if (typeof abrirModalBaja === 'function') abrirModalBaja($(this));
    });
</script>
