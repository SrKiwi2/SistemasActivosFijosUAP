<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: seguimiento/baja/tabla_registro.html — bajas registradas (entidad BajaActivo).
     Lo carga operaciones/baja/modulo.html (POST /administracion/baja/tabla) y lo convierte en
     tabla con SciafModulo.tabla. Cada fila lleva sus datos en data-* (filtros y detalle);
     al hacer clic se abre el detalle. Activo, responsable, persona y oficina llegan en la
     misma consulta (IBajaActivoDao.listarParaTabla), la baja más reciente primero.
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle js-tabla-bajas">
    <thead>
        <tr>
            <th style="width:170px;">N° documento</th>
            <th style="width:110px;">Fecha</th>
            <th style="width:150px;">Motivo</th>
            <th>Activo</th>
            <th>Responsable</th>
            <th class="text-end" style="width:110px;">Informe</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="baja : ${bajas}" class="baja-row" style="cursor:pointer;"
            th:with="motivoLabel=${baja.causa == 'ROBO' ? 'Robo' : (baja.causa == 'EXTRAVIO' ? 'Extravío' : (baja.causa == 'DANADO' ? 'Dañado' : (baja.causa == 'FIN_VIDA_UTIL' ? 'Cumplió vida útil' : baja.causa)))}"
            th:data-id="${baja.idBajaActivo}"
            th:data-numero="${baja.hr}"
            th:data-motivo="${motivoLabel}"
            th:data-fecha="${baja.fechaBaja}"
            th:data-codigo="${baja.activo != null ? baja.activo.codigo : ''}"
            th:data-activo="${baja.activo != null ? baja.activo.descripcion : ''}"
            th:data-responsable="${baja.responsable != null and baja.responsable.persona != null ? baja.responsable.persona.nombreCompleto : ''}"
            th:data-oficina="${baja.responsable != null and baja.responsable.oficina != null ? baja.responsable.oficina.nombre : ''}"
            th:data-descripcion="${baja.descripcion}"
            th:data-informe="${baja.informePath}"
            title="Ver el detalle de la baja">
            <td><span class="sm-codigo sm-mayus" th:text="${baja.hr ?: '—'}">—</span></td>
            <td th:text="${baja.fechaBaja ?: '—'}" th:attr="data-order=${baja.fechaBaja}">—</td>
            <td><span class="sm-pastilla sm-pastilla-peligro py-0" th:text="${motivoLabel ?: '—'}">—</span></td>
            <td>
                <span class="sm-codigo" th:text="${baja.activo != null ? baja.activo.codigo : '—'}">—</span>
                <div class="sm-sub text-truncate" style="max-width:340px"
                     th:text="${baja.activo != null ? baja.activo.descripcion : ''}"></div>
            </td>
            <td>
                <span th:if="${baja.responsable != null and baja.responsable.persona != null}"
                      th:text="${baja.responsable.persona.nombreCompleto}">—</span>
                <div class="sm-sub" th:if="${baja.responsable != null and baja.responsable.oficina != null}"
                     th:text="${baja.responsable.oficina.nombre}"></div>
                <span th:unless="${baja.responsable != null and baja.responsable.persona != null}" class="sm-sub">—</span>
            </td>
            <td class="text-end">
                <a th:if="${baja.informePath != null}" th:href="${baja.informePath}" target="_blank"
                   class="sm-btn sm-btn-sm sm-btn-suave sm-btn-icono js-informe" title="Ver el informe adjunto">
                    <i class="ti ti-file-type-pdf"></i></a>
                <span th:unless="${baja.informePath != null}" class="sm-sub" title="Sin informe">—</span>
            </td>
        </tr>
    </tbody>
</table>
