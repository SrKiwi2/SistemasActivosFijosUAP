<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: menu/tabla.html — el árbol del menú (Sección › Grupo › Ítem).
     · Al abrir la pantalla viene incluido en menu/vista.html (th:replace … :: arbol):
       un solo pedido. POST /administracion/menu/tabla lo devuelve para las recargas.
     · Sin onclick ni funciones globales: cada botón declara data-accion y lo atiende
       la vista. Cada nodo lleva data-* para buscar y filtrar (oculto, bloqueado…).
     · Los estilos viven en la vista (no se reenvían en cada recarga).
     ══════════════════════════════════════════════════════════════ -->
<div class="mn-arbol" th:fragment="arbol">

    <div th:if="${#lists.isEmpty(arbol)}" class="sm-aviso m-3">
        <i class="ti ti-info-circle"></i>
        <div>No hay opciones registradas todavía. Empiece con <strong>Agregar › Sección</strong>.</div>
    </div>

    <!-- Raíz: lista ordenable de secciones -->
    <div class="mn-lista mn-raiz" data-padre="" data-tipo-hijo="SECCION">
    <div th:each="seccion : ${arbol}" class="mn-nodo mn-seccion"
         th:classappend="${(seccion.visible ? '' : ' mn-oculto') + (seccion.bloqueado ? ' mn-bloqueado' : '')}"
         th:attr="data-id=${seccion.idOpcion}, data-tipo='SECCION', data-nombre=${seccion.descripcion},
                  data-oculto=${!seccion.visible}, data-bloqueado=${seccion.estado == 'BLOQUEADO'},
                  data-buscar=${#strings.toLowerCase(seccion.descripcion + ' ' + seccion.codigo)}">

        <div class="mn-fila">
            <span class="mn-asa" title="Arrastrar para ordenar"><i class="ti ti-grip-vertical"></i></span>
            <button type="button" class="mn-caret" data-accion="colapsar" title="Contraer o expandir"><i class="ti ti-chevron-down"></i></button>
            <span class="mn-tipo">Sección</span>
            <div class="mn-texto">
                <span class="mn-nombre text-uppercase" th:text="${seccion.descripcion}"></span>
                <span class="mn-meta">
                    <code th:text="${seccion.codigo}"></code>
                    <span class="mn-cuenta" th:text="${#lists.size(seccion.hijos)} + ' grupo(s)'"></span>
                    <th:block th:replace="~{menu/tabla :: estado(${seccion})}"></th:block>
                </span>
            </div>
            <th:block th:replace="~{menu/tabla :: acciones(${seccion}, 'GRUPO')}"></th:block>
        </div>

        <!-- Grupos de la sección (se pueden arrastrar a otra sección) -->
        <div class="mn-hijos mn-lista" th:attr="data-padre=${seccion.idOpcion}" data-tipo-hijo="GRUPO">
        <div th:each="grupo : ${seccion.hijos}" class="mn-nodo mn-grupo"
             th:classappend="${(grupo.visible ? '' : ' mn-oculto') + (grupo.bloqueado ? ' mn-bloqueado' : '')}"
             th:attr="data-id=${grupo.idOpcion}, data-tipo='GRUPO', data-nombre=${grupo.descripcion},
                      data-oculto=${!grupo.visible}, data-bloqueado=${grupo.estado == 'BLOQUEADO'},
                      data-buscar=${#strings.toLowerCase(grupo.descripcion + ' ' + grupo.codigo)}">

            <div class="mn-fila">
                <span class="mn-asa" title="Arrastrar para ordenar o llevar a otra sección"><i class="ti ti-grip-vertical"></i></span>
                <button type="button" class="mn-caret" data-accion="colapsar" title="Contraer o expandir"><i class="ti ti-chevron-down"></i></button>
                <span class="sm-gi" th:classappend="${'gi-' + grupo.colorClase}" style="width:30px;height:30px;">
                    <i th:class="${grupo.icono}"></i>
                </span>
                <div class="mn-texto">
                    <span class="mn-nombre" th:text="${grupo.descripcion}"></span>
                    <span class="mn-meta">
                        <code th:text="${grupo.codigo}"></code>
                        <span class="mn-cuenta" th:text="${#lists.size(grupo.hijos)} + ' ítem(s)'"></span>
                        <th:block th:replace="~{menu/tabla :: estado(${grupo})}"></th:block>
                    </span>
                </div>
                <th:block th:replace="~{menu/tabla :: acciones(${grupo}, 'ITEM')}"></th:block>
            </div>

            <!-- Ítems del grupo (se pueden arrastrar a otro grupo) -->
            <div class="mn-hijos mn-lista" th:attr="data-padre=${grupo.idOpcion}" data-tipo-hijo="ITEM">
            <div th:each="item : ${grupo.hijos}" class="mn-nodo mn-item"
                 th:classappend="${(item.visible or item.permisoPuro ? '' : ' mn-oculto') + (item.bloqueado ? ' mn-bloqueado' : '')}"
                 th:attr="data-id=${item.idOpcion}, data-tipo='ITEM', data-nombre=${item.descripcion},
                          data-oculto=${!item.visible and !item.permisoPuro}, data-bloqueado=${item.bloqueado},
                          data-permiso=${item.permisoPuro}, data-rota=${item.urlExiste != null and !item.urlExiste},
                          data-buscar=${#strings.toLowerCase(item.descripcion + ' ' + item.codigo + ' ' + (item.url ?: ''))}">
                <div class="mn-fila">
                    <span class="mn-asa" title="Arrastrar para ordenar o llevar a otro grupo"><i class="ti ti-grip-vertical"></i></span>
                    <span class="sm-si" th:classappend="${'si-' + item.colorClase}">
                        <i th:class="${item.icono}"></i>
                    </span>
                    <div class="mn-texto">
                        <span class="mn-nombre">
                            <span th:text="${item.descripcion}"></span>
                            <span class="sm-pastilla sm-pastilla-aviso py-0 ms-1" th:if="${item.badge != null}" th:text="${item.badge}"></span>
                        </span>
                        <span class="mn-meta">
                            <code th:text="${item.codigo}"></code>
                            <span class="mn-url" th:if="${item.url != null}" th:text="${item.url}" th:title="${item.url}"></span>
                            <span class="sm-pastilla sm-pastilla-info py-0" th:if="${item.permisoPuro}"
                                  title="No es una pantalla: es una casilla de permiso que habilita una acción">
                                <i class="ti ti-key"></i> permiso especial</span>
                            <span class="sm-pastilla sm-pastilla-peligro py-0" th:if="${item.urlExiste != null and !item.urlExiste}"
                                  title="No hay ninguna pantalla en el sistema con esta URL: el ítem no va a abrir nada">
                                <i class="ti ti-link-off"></i> URL no encontrada</span>
                            <span class="sm-pastilla py-0" th:if="${item.usuariosAsignados > 0}"
                                  th:title="'Asignado explícitamente a ' + ${item.usuariosAsignados} + ' usuario(s); el resto lo recibe por la plantilla de su rol'">
                                <i class="ti ti-users"></i> <span th:text="${item.usuariosAsignados}"></span></span>
                            <th:block th:replace="~{menu/tabla :: estado(${item})}"></th:block>
                        </span>
                    </div>
                    <th:block th:replace="~{menu/tabla :: acciones(${item}, null)}"></th:block>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>
    </div>

    <!-- Papelera: la vista pasa esta lista a su modal (no ocupa lugar en el árbol) -->
    <div class="js-papelera-fuente d-none" th:attr="data-cantidad=${#lists.size(eliminados)}">
        <div class="mn-papelera-fila" th:each="e : ${eliminados}" th:attr="data-id=${e.idOpcion}, data-nombre=${e.descripcion}">
            <span class="sm-pastilla py-0" th:text="${e.tipo}"></span>
            <i th:if="${e.icono != null}" th:class="${e.icono}"></i>
            <div class="mn-texto">
                <span class="mn-nombre" th:text="${e.descripcion}"></span>
                <span class="mn-meta">
                    <code th:text="${e.codigo}"></code>
                    <span th:if="${e.padre != null}" th:text="'en ' + ${e.padre.descripcion}"></span>
                    <span th:if="${e.modificacion != null}"
                          th:text="'· eliminada ' + ${#dates.format(e.modificacion, 'dd/MM/yyyy HH:mm')}"></span>
                </span>
            </div>
            <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-exito ms-auto" data-accion="restaurar">
                <i class="ti ti-restore"></i> Restaurar
            </button>
        </div>
    </div>
</div>

<!-- ── Fragmentos reutilizados arriba ─────────────────────────────────────── -->
<th:block th:if="false">
    <span th:fragment="estado(n)" class="d-inline-flex gap-1 flex-wrap">
        <span class="sm-pastilla py-0" th:if="${n.protegido}"
              title="No se puede ocultar, bloquear ni eliminar: sin esto no se podría administrar el sistema">
            <i class="ti ti-shield-check"></i> protegido</span>
        <span class="sm-pastilla py-0" th:if="${!n.visible and !n.permisoPuro}"><i class="ti ti-eye-off"></i> oculto</span>
        <span class="sm-pastilla sm-pastilla-peligro py-0" th:if="${n.estado == 'BLOQUEADO'}"><i class="ti ti-lock"></i> bloqueado</span>
        <span class="sm-pastilla sm-pastilla-aviso py-0" th:if="${n.bloqueado and n.estado != 'BLOQUEADO'}"
              title="Está dentro de un grupo o sección bloqueada"><i class="ti ti-lock"></i> bloqueado por el grupo</span>
    </span>

    <span th:fragment="acciones(n, tipoHijo)" class="mn-acciones">
        <button type="button" class="sm-btn sm-btn-sm sm-btn-neutro sm-btn-icono" data-accion="subir" title="Subir">
            <i class="ti ti-arrow-up"></i></button>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-neutro sm-btn-icono" data-accion="bajar" title="Bajar">
            <i class="ti ti-arrow-down"></i></button>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-exito sm-btn-icono" th:if="${tipoHijo != null}"
                data-accion="agregar" th:attr="data-tipo-hijo=${tipoHijo}"
                th:title="${tipoHijo == 'GRUPO' ? 'Agregar un grupo en esta sección' : 'Agregar un ítem en este grupo'}">
            <i class="ti ti-plus"></i></button>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-icono" th:if="${n.url != null and n.visible}"
                data-accion="abrir" th:attr="data-url=${n.url}" title="Abrir la pantalla">
            <i class="ti ti-external-link"></i></button>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-icono" data-accion="editar"
                title="Editar (nombre, ícono, color, URL, ubicación)">
            <i class="ti ti-pencil"></i></button>
        <th:block th:unless="${n.permisoPuro}">
        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-icono" th:disabled="${n.protegido and n.visible}"
                data-accion="visible" th:attr="data-visible=${n.visible}"
                th:title="${n.visible ? 'Ocultar del menú' : 'Mostrar en el menú'}">
            <i th:class="${n.visible ? 'ti ti-eye-off' : 'ti ti-eye'}"></i></button>
        </th:block>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-icono sm-btn-peligro" th:disabled="${n.protegido and n.estado != 'BLOQUEADO'}"
                th:classappend="${n.estado == 'BLOQUEADO' ? '' : 'sm-btn-suave'}"
                data-accion="bloquear" th:attr="data-bloquear=${n.estado != 'BLOQUEADO'}"
                th:title="${n.estado == 'BLOQUEADO' ? 'Desbloquear' : 'Bloquear (mantenimiento)'}">
            <i th:class="${n.estado == 'BLOQUEADO' ? 'ti ti-lock-open' : 'ti ti-lock'}"></i></button>
        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro sm-btn-icono" th:disabled="${n.protegido}"
                data-accion="eliminar" th:attr="data-usuarios=${n.usuariosAsignados}" title="Eliminar (va a la papelera)">
            <i class="ti ti-trash"></i></button>
    </span>
</th:block>
