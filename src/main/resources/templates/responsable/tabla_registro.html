<div class="card">
    <!-- Encabezado responsivo: apila botones en móvil -->
    <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <h5 class="m-0">Registro Responsable</h5>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button type="button" class="btn btn-outline-secondary text-nowrap" data-bs-toggle="modal" data-bs-target="#modalImportDbf">
              <i class="fa-solid fa-file-import me-1"></i> <span class="d-none d-sm-inline">Importar DBF</span>
            </button>
            <button type="button" class="btn btn-primary text-nowrap" onclick="cargarFormulario()" data-bs-toggle="modal" data-bs-target="#modalFormularioResponsable">
                <i class="fa-solid fa-user-plus me-1"></i> Agregar Responsable
            </button>
        </div>
    </div>
    
    <div class="card-datatable table-responsive pt-0">
        <!-- style width:100% vital para DataTables responsive -->
        <table class="datatables-basic table table-hover" id="data-table" style="width: 100%;">
            <thead>
                <tr>
                    <th>#</th>
                    <th>CÓD. FUNCIONARIO</th>
                    <th>NOMBRE</th>
                    <th>PATERNO</th>
                    <th>MATERNO</th>
                    <th>C.I.</th>
                    <th>OFICINA</th>
                    <th>CARGO</th>
                    <th>OPCIONES</th>
                </tr>
            </thead>
            <tbody class="animate__animated animate__bounceInDown">
                <tr th:each="responsables, index: ${listaResponsables}">
                    <!-- CORRECCIÓN: Todo esto a <td> para que la tabla no se descuadre -->
                    <td th:text="${index.index+1}"></td>
                    <td th:text="${responsables.codigoFuncionario}"></td>
                    <td th:text="${responsables?.persona?.nombre ?: 'Vacío'}"></td>
                    <td th:text="${responsables?.persona?.paterno ?: 'Vacío'}"></td>
                    <td th:text="${responsables?.persona?.materno ?: 'Vacío'}"></td>
                    <td th:text="${responsables?.persona?.ci ?: 'Vacío'}"></td>                    
                    <td th:text="${responsables.oficina.codOfi}"></td>
                    <td th:text="${responsables?.cargo?.nombre ?: 'Vacío'}"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger text-nowrap" th:onclick="eliminar([[${responsables.persona.nombre}]],[[${id_encryptado[__${index.index}__]}]])">
                            <i class="fa-solid fa-trash"></i> <span class="d-none d-lg-inline">Eliminar</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    $('#data-table').DataTable({
        scrollX: true,       // Habilita barra de desplazamiento horizontal en móviles
        autoWidth: false,    // Evita cálculos forzados de columnas que rompen el diseño
        language: {
            "sLengthMenu": "Mostrar _MENU_ registros",
            "sZeroRecords": "No se encontraron resultados",
            "sInfo": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
            "sInfoEmpty": "Mostrando registros del 0 al 0 de un total de 0 registros",
            "sInfoFiltered": "(filtrado de un total de _MAX_ registros)",
            "sInfoPostFix": "",
            "sSearch": "Buscar:",
            "sUrl": "",
            "sInfoThousands": ",",
            "oPaginate": {
                "sFirst": "Primero",
                "sLast": "Último",
                "sNext": "Siguiente",
                "sPrevious": "Anterior"
            },
            "oAria": {
                "sSortAscending": ": Activar para ordenar la columna de manera ascendente",
                "sSortDescending": ": Activar para ordenar la columna de manera descendente"
            }
        }
    });
</script>
