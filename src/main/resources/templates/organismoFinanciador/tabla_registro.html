<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: organismoFinanciador/tabla_registro.html — organismos financiadores.
     · Al abrir llega incluido en organismoFinanciador/vista.html (th:replace … :: tabla).
       POST /administracion/organismo/tabla-registros lo devuelve para recargar.
     · .js-sync-info: estado de la última sincronización (la vista lo pasa a la cabecera).
     · Solo lectura: el catálogo es del VSIAF (ORGANISMO_FIN.DBF) y se trae sincronizando.
     ══════════════════════════════════════════════════════════════ -->
<div class="js-contenido" th:fragment="tabla">
    <span class="js-sync-info d-none"
          th:attr="data-ultima=${ultimaSincronizacion ?: 'Nunca'}, data-estado=${estadoSync ?: 'PENDIENTE'},
                   data-procesados=${registrosProcesados ?: 0}, data-nuevos=${registrosNuevos ?: 0},
                   data-actualizados=${registrosActualizados ?: 0}, data-duracion=${duracionUltimaSync ?: 0},
                   data-origen=${sourceUsed}"></span>

    <table class="table sm-tabla align-middle js-tabla-of">
        <thead>
            <tr>
                <th style="width:120px;">Gestión</th>
                <th style="width:130px;">Código</th>
                <th>Organismo financiador</th>
                <th style="width:160px;">Sigla</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="of : ${listasOrganismoFinanciero}" th:attr="data-gestion=${of.gestion}">
                <td th:attr="data-order=${of.gestion}">
                    <span class="sm-pastilla sm-pastilla-info py-0" th:text="${of.gestion}"></span>
                </td>
                <td><span class="sm-codigo sm-mayus" th:text="${of.codOf}"></span></td>
                <td class="sm-nombre" th:text="${of.descripcion}"></td>
                <td>
                    <span th:if="${of.sigla != null and !#strings.isEmpty(of.sigla)}" class="sm-pastilla py-0 sm-mayus"
                          th:text="${of.sigla}"></span>
                    <span th:unless="${of.sigla != null and !#strings.isEmpty(of.sigla)}" class="sm-sub">—</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
