<!-- ═══════════════════════════════════════════════════════════════
     PANTALLA: Autorizaciones — solicitudes de operaciones de alto impacto.
     Ven: ADMINISTRADOR y SUPER USUARIO. Resuelven: el ADMINISTRADOR y el SUPER USUARIO
     designado como revisor. Plantilla de mantenimiento (docs/PLANTILLA_MODULOS.md):
       · el listado llega con la vista (${inicial}): al abrir no se pide nada más;
       · en vivo con el evento SSE "autorizacion" (ráfagas → un solo refresco);
       · todo dentro de #modAutorizaciones y sin funciones globales.
     ══════════════════════════════════════════════════════════════ -->
<div class="sm-pagina" id="modAutorizaciones">

<style>
    #modAutorizaciones .aut-tipo { font-size: .72rem; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: #b45309; }
    #modAutorizaciones .aut-ref { font: 700 .82rem ui-monospace, Consolas, monospace; color: var(--sm-texto);
        background: var(--sm-superficie-2); border: 1px solid var(--sm-borde); border-radius: 7px; padding: .1rem .5rem; }
    #modAutorizaciones .aut-motivo { font-size: .86rem; color: var(--sm-texto-2); }
    #modAutorizaciones .aut-revisor { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    #modAutorizaciones .aut-revisor .sm-avatar { width: 36px; height: 36px; font-size: 1rem; }
    #modAutorizaciones .aut-oculta { display: none !important; }
    html.dark-style #modAutorizaciones .aut-tipo, html[data-theme="dark"] #modAutorizaciones .aut-tipo { color: #fbbf24; }
</style>

<header class="sm-cabecera">
    <div class="sm-cabecera-icono"><i class="ti ti-shield-check"></i></div>
    <div class="sm-cabecera-texto">
        <nav class="sm-migas" aria-label="Ubicación">
            <i class="ti ti-eye-check"></i> Supervisión <i class="ti ti-chevron-right"></i> Autorizaciones
        </nav>
        <h1 class="sm-titulo">Autorizaciones</h1>
        <p class="sm-subtitulo">Operaciones de alto impacto que esperan aprobación antes de aplicarse (y enviarse al VSIAF).</p>
    </div>
    <div class="sm-cabecera-acciones">
        <span class="sm-dato"><strong class="js-n-pend text-warning">—</strong> pendientes</span>
        <span class="sm-dato" title="Entre las últimas 100 resueltas"><strong class="js-n-apr text-success">—</strong> aprobadas</span>
        <span class="sm-dato" title="Entre las últimas 100 resueltas"><strong class="js-n-rech text-danger">—</strong> rechazadas</span>
        <span class="sm-vivo" title="Se actualiza sola cuando llega o se resuelve una solicitud">En vivo</span>
    </div>
</header>

<section class="sm-card">
    <div class="sm-toolbar">
        <div class="sm-segmento js-vista" role="group" aria-label="Ver">
            <button type="button" class="activo" data-vista="pendientes"><i class="ti ti-hourglass"></i> Pendientes
                <span class="sm-cuenta js-c-pend">0</span></button>
            <button type="button" data-vista="historial"><i class="ti ti-history"></i> Historial
                <span class="sm-cuenta js-c-hist">0</span></button>
        </div>
        <div class="sm-buscador">
            <i class="ti ti-search"></i>
            <input type="text" class="sm-input js-buscar" placeholder="Buscar por código, solicitante o motivo…"
                autocomplete="off" aria-label="Buscar solicitud" />
            <button type="button" class="sm-buscador-limpiar" title="Limpiar búsqueda (Esc)"><i class="ti ti-x"></i></button>
        </div>

        <!-- Revisor designado -->
        <div class="sm-toolbar-grupo aut-revisor">
            <span class="sm-avatar"><i class="ti ti-user-shield"></i></span>
            <div class="sm-persona-texto">
                <span class="sm-sub">Revisor de solicitudes</span>
                <span class="fw-semibold js-revisor"
                      th:text="${revisor != null ? revisor.usuario : 'Sin designar (solo el administrador)'}">—</span>
            </div>
            <th:block th:if="${esAdministrador}">
                <select class="sm-select js-sel-revisor" aria-label="Revisor" style="width:auto;min-width:210px;">
                    <option value="">— Sin revisor —</option>
                    <option th:each="u : ${superUsuarios}" th:value="${u.idUsuario}"
                            th:text="${u.usuario + (u.persona != null ? ' · ' + u.persona.nombre : '')}"
                            th:selected="${revisor != null and revisor.idUsuario == u.idUsuario}"></option>
                </select>
                <button type="button" class="sm-btn sm-btn-sm" data-accion="revisor"><i class="ti ti-device-floppy"></i> Guardar</button>
            </th:block>
            <span th:unless="${puedeRevisar}" class="sm-pastilla py-0" title="No está designado como revisor">
                <i class="ti ti-eye"></i> Solo lectura</span>
        </div>
    </div>

    <!-- Pendientes: tarjetas -->
    <div class="sm-tarjetas js-pendientes"></div>

    <!-- Historial: tabla -->
    <div class="js-historial d-none"></div>
</section>

</div>

<script th:inline="javascript">
    (function () {
        'use strict';

        const URL = '/administracion/autorizaciones';
        const PUEDE_REVISAR = /*[[${puedeRevisar == true}]]*/ false;
        let datos = /*[[${inicial}]]*/ { pendientes: [], historial: [] };

        const $raiz = $('#modAutorizaciones');
        const $pend = $raiz.find('.js-pendientes');
        const $hist = $raiz.find('.js-historial');
        const $buscar = $raiz.find('.js-buscar');
        const esc = SciafModulo.escapar;
        const norm = t => window.SciafCatalogos ? SciafCatalogos.normalizarTexto(t || '') : (t || '').toLowerCase();
        const ESTADOS = { APROBADA: 'sm-pastilla-activo', RECHAZADA: 'sm-pastilla-peligro', FALLIDA: 'sm-pastilla-aviso', ANULADA: '' };

        let vista = 'pendientes';
        let idsVistos = null;           // para resaltar las solicitudes que llegan en vivo

        /* ── Pendientes ──────────────────────────────────────────────────── */
        function tarjeta(s, nueva) {
            const texto = [s.tipoTexto, s.referencia, s.solicitante, s.resumen, s.motivo].join(' ');
            const botones = PUEDE_REVISAR
                ? '<div class="sm-acciones">'
                  + '<button type="button" class="sm-btn sm-btn-sm sm-btn-exito" data-resolver="aprobar" data-id="' + s.idSolicitud + '">'
                  + '<i class="ti ti-check"></i> Aprobar</button>'
                  + '<button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-peligro" data-resolver="rechazar" data-id="' + s.idSolicitud + '">'
                  + '<i class="ti ti-x"></i> Rechazar</button></div>'
                : '<div class="sm-sub mt-auto"><i class="ti ti-eye"></i> Solo el revisor puede resolverla.</div>';
            return '<div class="sm-tarjeta sm-tarjeta-acento' + (nueva ? ' sm-nuevo' : '') + '" style="--sm-acento:#f59e0b"'
                + ' data-buscar="' + esc(texto.toLowerCase()) + '">'
                + '<div class="d-flex justify-content-between align-items-start gap-2">'
                +   '<div><div class="aut-tipo">' + esc(s.tipoTexto) + '</div><span class="aut-ref">' + esc(s.referencia) + '</span></div>'
                +   '<span class="sm-sub text-nowrap"><i class="ti ti-clock"></i> ' + esc(s.fechaSolicitud) + '</span>'
                + '</div>'
                + '<div class="sm-persona"><span class="sm-avatar" style="width:32px;height:32px;font-size:.8rem">'
                +   esc(String(s.solicitante || '?').substring(0, 2).toUpperCase()) + '</span>'
                +   '<span class="small">Pedido por <strong>' + esc(s.solicitante) + '</strong></span></div>'
                + '<div class="sm-bloque"><i class="ti ti-arrows-right-left text-muted"></i> ' + esc(s.resumen) + '</div>'
                + '<div class="aut-motivo"><strong>Motivo:</strong> ' + esc(s.motivo) + '</div>'
                + botones + '</div>';
        }

        function pintarPendientes() {
            const pend = datos.pendientes || [];
            const nuevos = new Set(pend.map(p => p.idSolicitud));
            $pend.html(pend.length
                ? pend.map(s => tarjeta(s, idsVistos && !idsVistos.has(s.idSolicitud))).join('')
                : '<div class="sm-vacio"><i class="ti ti-circle-check text-success"></i>No hay solicitudes pendientes.</div>');
            idsVistos = nuevos;
            filtrarTarjetas();
        }

        function filtrarTarjetas() {
            const q = norm($buscar.val()).trim();
            $pend.find('.sm-tarjeta').each(function () {
                this.classList.toggle('aut-oculta', !!q && !norm(this.dataset.buscar).includes(q));
            });
        }

        /* ── Historial (tabla de la plantilla) ───────────────────────────── */
        function pintarHistorial() {
            const hist = datos.historial || [];
            $hist.html('<table class="table sm-tabla align-middle"><thead><tr>'
                + '<th>Solicitud</th><th style="width:180px;">Solicitante</th><th style="width:130px;">Estado</th>'
                + '<th style="width:180px;">Resuelta por</th><th>Respuesta</th></tr></thead><tbody>'
                + hist.map(s => '<tr>'
                    + '<td><div class="aut-tipo">' + esc(s.tipoTexto) + '</div><span class="aut-ref">' + esc(s.referencia) + '</span>'
                    +   '<div class="sm-sub mt-1">' + esc(s.resumen) + '</div></td>'
                    + '<td><span class="fw-semibold">' + esc(s.solicitante) + '</span><div class="sm-sub">' + esc(s.fechaSolicitud) + '</div></td>'
                    + '<td><span class="sm-pastilla py-0 ' + (ESTADOS[s.estado] || '') + '">' + esc(s.estado) + '</span></td>'
                    + '<td><span class="fw-semibold">' + esc(s.revisor || '—') + '</span><div class="sm-sub">' + esc(s.fechaRevision) + '</div></td>'
                    + '<td class="small">' + esc(s.respuesta || '') + '</td></tr>').join('')
                + '</tbody></table>');
            if (vista === 'historial') iniciarHistorial();
        }

        function iniciarHistorial() {
            SciafModulo.tabla({
                tabla: $hist.find('table'),
                buscador: $buscar,
                orden: [],
                altoFila: 72,
                dt: { language: { sEmptyTable: 'Sin solicitudes resueltas todavía.' } }
            });
        }

        function pintar() {
            const pend = datos.pendientes || [], hist = datos.historial || [];
            $raiz.find('.js-n-pend, .js-c-pend').text(pend.length);
            $raiz.find('.js-c-hist').text(hist.length);
            $raiz.find('.js-n-apr').text(hist.filter(s => s.estado === 'APROBADA').length);
            $raiz.find('.js-n-rech').text(hist.filter(s => s.estado === 'RECHAZADA').length);
            pintarPendientes();
            pintarHistorial();
        }

        function cargar() {
            const $tarjeta = $pend.closest('.sm-card').addClass('sm-procesando');
            SciafModulo.pedirJson(URL + '/api/listado', { metodo: 'GET' })
                .then(r => { datos = r; pintar(); })
                .catch(e => SciafModulo.avisarError(e, 'No se pudieron cargar las solicitudes'))
                .finally(() => $tarjeta.removeClass('sm-procesando'));
        }

        /* ── Cambiar entre Pendientes e Historial ────────────────────────── */
        $raiz.on('click', '.js-vista button', function () {
            vista = this.dataset.vista;
            $raiz.find('.js-vista button').removeClass('activo').filter('[data-vista="' + vista + '"]').addClass('activo');
            $pend.toggleClass('d-none', vista !== 'pendientes');
            $hist.toggleClass('d-none', vista !== 'historial');
            if (vista === 'historial') iniciarHistorial(); else recalcularAlto();
        });

        $buscar.on('input.autPend', filtrarTarjetas);

        /* ── Resolver ────────────────────────────────────────────────────── */
        function resolver(id, accion) {
            const aprobar = accion === 'aprobar';
            Swal.fire({
                title: aprobar ? '¿Aprobar la solicitud?' : '¿Rechazar la solicitud?',
                text: aprobar ? 'El cambio se aplica ahora y se envía al VSIAF.' : 'El solicitante verá el motivo.',
                input: 'textarea',
                inputPlaceholder: aprobar ? 'Comentario (opcional)' : 'Motivo del rechazo (obligatorio)',
                inputValidator: v => (!aprobar && !(v || '').trim()) ? 'Indique el motivo del rechazo' : undefined,
                icon: aprobar ? 'question' : 'warning',
                showCancelButton: true,
                reverseButtons: true,
                confirmButtonText: aprobar ? 'Sí, aprobar' : 'Sí, rechazar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: aprobar ? '#15803d' : '#c92a2a'
            }).then(function (r) {
                if (!r.isConfirmed) return;
                SciafModulo.pedirJson(URL + '/api/' + id + '/' + accion, { datos: { comentario: r.value || '' } })
                    .then(function (res) {
                        if (res.estado == null && res.ok === false) {
                            Swal.fire('No se pudo', res.msg || 'No se pudo resolver la solicitud.', 'warning');
                            return;
                        }
                        const ok = res.estado === 'APROBADA' || res.estado === 'RECHAZADA';
                        Swal.fire({
                            toast: ok, position: ok ? 'top-end' : 'center',
                            icon: res.estado === 'FALLIDA' ? 'warning' : 'success',
                            title: res.estado === 'FALLIDA' ? 'Aprobada, pero no se pudo aplicar' : 'Solicitud ' + String(res.estado || '').toLowerCase(),
                            text: res.msg, showConfirmButton: !ok, timer: ok ? 3500 : undefined
                        });
                    })
                    .catch(e => SciafModulo.avisarError(e))
                    .finally(cargar);
            });
        }

        $raiz.on('click', '[data-resolver]', function () { resolver(this.dataset.id, this.dataset.resolver); });

        /* ── Revisor designado ───────────────────────────────────────────── */
        $raiz.on('click', '[data-accion="revisor"]', function () {
            const $sel = $raiz.find('.js-sel-revisor');
            const id = $sel.val();
            const nombre = id ? $sel.find('option:selected').text() : 'nadie (solo el administrador)';
            SciafModulo.accion({
                url: URL + '/api/revisor',
                datos: id ? { idUsuario: id } : {},
                confirmacion: { titulo: '¿Cambiar el revisor?', texto: 'Desde ahora revisará las solicitudes: <b>' + esc(nombre) + '</b>.',
                                aceptar: 'Sí, cambiar' },
                alTerminar: function () {
                    $raiz.find('.js-revisor').text(id ? $sel.find('option:selected').text() : 'Sin designar (solo el administrador)');
                }
            });
        });

        /* ── En vivo ─────────────────────────────────────────────────────── */
        if (window.sciafEscuchar) {
            let espera;
            window.sciafEscuchar('autorizacion', 'bandeja', function () {
                clearTimeout(espera);
                espera = setTimeout(cargar, 400);
            });
        }

        // Las tarjetas tienen su propio scroll, del alto que queda en pantalla.
        const recalcularAlto = SciafModulo.ajustarAlto($pend);
        pintar();
    })();
</script>
