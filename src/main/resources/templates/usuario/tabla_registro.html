<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: usuario/tabla_registro.html — solo la tabla (plantilla de mantenimiento).
     La barra (buscador, filtro por estado, rol, filas) y todas las acciones viven en
     usuario/vista.html. Cada fila lleva sus datos en data-* para los filtros y los
     contadores; los botones llevan data-accion y los atiende la vista.
     ══════════════════════════════════════════════════════════════ -->
<table class="table sm-tabla align-middle js-tabla-usuarios">
    <thead>
        <tr>
            <th>Usuario</th>
            <th style="width:190px;">Rol y permisos</th>
            <th style="width:170px;">Estado</th>
            <th style="width:175px;">Último ingreso</th>
            <th class="text-end" style="width:270px;">Opciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="f : ${filas}" th:classappend="${f.estado != 'ACTIVO'} ? 'sm-fila-inactiva'"
            th:attr="data-estado=${f.estado}, data-conectado=${f.conectado}, data-fallidos=${f.fallidosRecientes}, data-rol=${f.rol}">
            <td>
                <div class="sm-persona">
                    <span class="sm-avatar"
                          th:text="${#strings.length(f.nombreCompleto) > 0 ? #strings.toUpperCase(#strings.substring(f.nombreCompleto,0,1)) : '?'}">?</span>
                    <div class="sm-persona-texto">
                        <span class="sm-nombre" th:text="${f.nombreCompleto}"></span>
                        <span class="sm-sub">
                            <code th:text="${f.usuario}"></code>
                            <span th:if="${f.ci != null}" class="sm-mayus" th:text="${' · C.I. ' + f.ci}"></span>
                            <span class="sm-pastilla sm-pastilla-info ms-1 py-0" th:if="${f.esYo}">usted</span>
                        </span>
                    </div>
                </div>
            </td>
            <td>
                <span class="sm-pastilla"
                      th:classappend="${f.rol == 'ADMINISTRADOR'} ? 'sm-pastilla-peligro' : (${f.rol == 'SUPER USUARIO'} ? 'sm-pastilla-aviso' : 'sm-pastilla-info')"
                      th:text="${f.rol}"></span>
                <div class="sm-sub mt-1">
                    <span th:if="${f.estado != 'ACTIVO'}" class="text-danger">Sin permisos</span>
                    <span th:if="${f.estado == 'ACTIVO' and f.permisosPropios == 0}"
                          title="No tiene permisos propios: ve lo que define su rol">Plantilla del rol</span>
                    <span th:if="${f.estado == 'ACTIVO' and f.permisosPropios > 0}"
                          th:text="${f.permisosPropios} + ' permisos propios'"></span>
                </div>
            </td>
            <td>
                <div class="sm-pastillas">
                    <span class="sm-pastilla sm-pastilla-activo" th:if="${f.estado == 'ACTIVO'}">Activo</span>
                    <span class="sm-pastilla sm-pastilla-peligro" th:if="${f.estado != 'ACTIVO'}"
                          title="Desactivado: no puede ingresar ni tiene permisos de menú">
                        <i class="ti ti-user-off"></i> Desactivado</span>
                    <span class="sm-pastilla sm-pastilla-linea" th:if="${f.conectado}" title="Tiene el sistema abierto ahora">en línea</span>
                </div>
                <div class="sm-sub mt-1" th:if="${f.estado != 'ACTIVO' and f.respaldo != null}">
                    <i class="ti ti-archive"></i>
                    <span th:text="${f.respaldo > 0 ? 'Respaldo: ' + f.respaldo + ' permiso(s)' : 'Respaldo: plantilla del rol'}"></span>
                </div>
            </td>
            <td th:attr="data-order=${f.ultimoIngreso != null ? #temporals.format(f.ultimoIngreso, 'yyyyMMddHHmm') : '0'}">
                <span th:if="${f.ultimoIngreso != null}"
                      th:text="${#temporals.format(f.ultimoIngreso, 'dd/MM/yyyy HH:mm')}"></span>
                <span th:if="${f.ultimoIngreso == null}" class="sm-sub">Sin registro</span>
                <div th:if="${f.fallidosRecientes > 0}" class="sm-sub fw-semibold"
                     th:classappend="${f.fallidosRecientes >= 3} ? 'text-danger' : 'text-warning'">
                    <i class="ti ti-alert-triangle"></i>
                    <span th:text="${f.fallidosRecientes} + ' intento(s) fallido(s) en 7 días'"></span>
                </div>
            </td>
            <td class="text-end">
                <div class="sm-acciones">
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave usr-accion" data-accion="editar"
                        th:attr="data-id=${f.idCifrado}" title="Editar persona, nombre de usuario y rol">
                        <i class="ti ti-edit"></i> Editar
                    </button>
                    <button type="button" class="sm-btn sm-btn-sm sm-btn-suave sm-btn-exito usr-accion" data-accion="permisos"
                        th:attr="data-id=${f.idCifrado}" title="Opciones del menú que puede usar">
                        <i class="ti ti-list-check"></i> Permisos
                    </button>
                    <div class="dropdown">
                        <button type="button" class="sm-btn sm-btn-sm sm-btn-neutro sm-btn-icono" data-bs-toggle="dropdown"
                            aria-expanded="false" title="Más acciones"><i class="ti ti-dots-vertical"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end sm-menu-flotante"
                            th:attr="data-id=${f.idCifrado}, data-usuario=${f.usuario}, data-nombre=${f.nombreCompleto}">
                            <li><a class="dropdown-item usr-accion" href="javascript:void(0)" data-accion="restablecer">
                                <i class="ti ti-key"></i> Restablecer contraseña</a></li>
                            <li><a class="dropdown-item usr-accion" href="javascript:void(0)" data-accion="accesos">
                                <i class="ti ti-login"></i> Historial de accesos</a></li>
                            <li><a class="dropdown-item usr-accion" href="javascript:void(0)" data-accion="historial">
                                <i class="ti ti-history"></i> Historial de permisos</a></li>
                            <!-- Siempre: con "mantener la sesión iniciada" puede tener sesiones aunque no esté conectado ahora -->
                            <li th:if="${!f.esYo}"><a class="dropdown-item usr-accion" href="javascript:void(0)" data-accion="sesiones">
                                <i class="ti ti-devices"></i> Sesiones abiertas</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li th:if="${f.estado == 'ACTIVO' and !f.esYo}"><a class="dropdown-item text-warning usr-accion"
                                href="javascript:void(0)" data-accion="desactivar">
                                <i class="ti ti-user-off"></i> Desactivar</a></li>
                            <li th:if="${f.estado != 'ACTIVO'}"><a class="dropdown-item text-success usr-accion"
                                href="javascript:void(0)" data-accion="activar">
                                <i class="ti ti-user-check"></i> Activar</a></li>
                            <li th:if="${!f.esYo}"><a class="dropdown-item text-danger usr-accion"
                                href="javascript:void(0)" data-accion="eliminar">
                                <i class="ti ti-trash"></i> Eliminar</a></li>
                        </ul>
                    </div>
                </div>
            </td>
        </tr>
    </tbody>
</table>
