<!-- ═══════════════════════════════════════════════════════════════
     PANTALLA: Hojas de ruta › Búsqueda y Seguimiento — plantilla de pantallas
     (docs/PLANTILLA_MODULOS.md). Solo lectura, para ADMINISTRADOR y SUPER USUARIO (lo
     valida el controlador; quien no lo es recibe supervision/sin_permiso).
     El registro de hojas y movimientos es de Recepción (hojaRuta/vista.html).
     Backend:
       GET  /administracion/hoja-ruta/seguimiento         (vista + tabla de la gestión actual)
       POST /administracion/hoja-ruta/seguimiento/tabla   (tabla: hojaRuta/tabla.html)
       POST /administracion/hoja-ruta/buscar              (datos + trayectoria, por idHojaRuta)
     Todo dentro de #modHojaRuta y sin funciones globales.
     ══════════════════════════════════════════════════════════════ -->
<div class="sm-pagina" id="modHojaRuta">

<style>
    /* Lista a la izquierda, la hoja elegida a la derecha. */
    #modHojaRuta .hrs-cuerpo {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr);
        gap: 1rem;
        align-items: start;
    }
    #modHojaRuta .hrs-cuerpo > .sm-card { margin-bottom: 0; min-width: 0; }

    #modHojaRuta .hrs-tabla tbody tr.hrs-fila { cursor: pointer; }
    #modHojaRuta .hrs-tabla tbody tr.hrs-fila:focus-visible { outline: 2px solid var(--sm-primario); outline-offset: -2px; }
    #modHojaRuta .hrs-tabla tbody tr.hrs-sel > td { background: rgba(var(--sm-primario-rgb), 0.08); }
    #modHojaRuta .hrs-tabla tbody tr.hrs-sel > td:first-child { box-shadow: inset 3px 0 0 var(--sm-primario); }

    #modHojaRuta .hrs-pastilla-archivado {
        background: var(--sm-superficie-3);
        color: var(--sm-texto-2);
        border-color: var(--sm-borde-fuerte);
    }

    /* ── Detalle ── */
    #modHojaRuta .hrs-detalle-cuerpo { padding: 1rem 1.1rem; }
    #modHojaRuta .hrs-det-cab {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.9rem;
    }
    #modHojaRuta .hrs-det-numero { font-size: 1.35rem; margin: 0.1rem 0 0; }
    #modHojaRuta .hrs-campos {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.7rem 1rem;
    }
    #modHojaRuta .hrs-campo-ancho { grid-column: 1 / -1; }
    #modHojaRuta .hrs-campo-l {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--sm-texto-2);
    }
    #modHojaRuta .hrs-campo-v { color: var(--sm-texto); word-break: break-word; }

    /* ── Trayectoria ── */
    #modHojaRuta .hrs-tl { list-style: none; margin: 0; padding: 0 0 0 1.6rem; position: relative; }
    #modHojaRuta .hrs-tl::before {
        content: '';
        position: absolute;
        left: 0.55rem;
        top: 0.4rem;
        bottom: 0.4rem;
        width: 2px;
        background: var(--sm-borde);
    }
    #modHojaRuta .hrs-ev { position: relative; padding-bottom: 0.8rem; }
    #modHojaRuta .hrs-ev:last-child { padding-bottom: 0; }
    #modHojaRuta .hrs-ev-punto {
        position: absolute;
        left: -1.35rem;
        top: 0.55rem;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 3px solid var(--sm-superficie);
        background: var(--sm-texto-2);
        box-shadow: 0 0 0 1px var(--sm-borde);
    }
    #modHojaRuta .hrs-ev-punto[data-e="RECIBIDO"] { background: var(--sm-exito); }
    #modHojaRuta .hrs-ev-punto[data-e="ENVIADO"] { background: var(--sm-primario); }
    #modHojaRuta .hrs-ev-tarjeta {
        background: var(--sm-superficie-2);
        border: 1px solid var(--sm-borde);
        border-radius: 10px;
        padding: 0.6rem 0.75rem;
    }
    #modHojaRuta .hrs-ev-actual .hrs-ev-tarjeta {
        border-color: var(--sm-primario-borde);
        box-shadow: 0 0 0 2px rgba(var(--sm-primario-rgb), 0.12);
    }
    #modHojaRuta .hrs-ev-fila {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
    }
    #modHojaRuta .hrs-ev-fecha { font-size: 0.8rem; color: var(--sm-texto-2); font-variant-numeric: tabular-nums; }
    #modHojaRuta .hrs-flujo { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.45rem; }
    #modHojaRuta .hrs-unidad {
        background: var(--sm-superficie);
        border: 1px solid var(--sm-borde);
        border-radius: 6px;
        padding: 0.1rem 0.5rem;
        font-size: 0.82rem;
        text-transform: uppercase;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #modHojaRuta .hrs-obs { margin-top: 0.4rem; font-size: 0.85rem; color: var(--sm-texto-2); }

    @media (max-width: 991.98px) {
        #modHojaRuta .hrs-cuerpo { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 575.98px) {
        #modHojaRuta .hrs-campos { grid-template-columns: minmax(0, 1fr); }
    }
</style>

<header class="sm-cabecera">
    <div class="sm-cabecera-icono"><i class="ti ti-zoom-check"></i></div>
    <div class="sm-cabecera-texto">
        <nav class="sm-migas" aria-label="Ubicación">
            <i class="ti ti-file-description"></i> Hojas de ruta <i class="ti ti-chevron-right"></i> Búsqueda y seguimiento
        </nav>
        <h1 class="sm-titulo">Seguimiento de hojas de ruta</h1>
        <p class="sm-subtitulo">Dónde está cada hoja y por dónde pasó. Se registran y mueven desde Recepción.</p>
    </div>
    <div class="sm-cabecera-acciones">
        <span class="sm-dato"><strong class="js-total">—</strong> hojas</span>
        <span class="sm-dato" title="Hojas que todavía no se archivaron"><strong class="js-tramite">—</strong> en trámite</span>
    </div>
</header>

<div class="hrs-cuerpo">

    <section class="sm-card js-tarjeta-lista">
        <div class="sm-toolbar">
            <div class="sm-buscador">
                <i class="ti ti-search"></i>
                <input type="text" class="sm-input js-buscar" placeholder="Buscar N°, solicitante, unidad, descripción…"
                       autocomplete="off" aria-label="Buscar hoja de ruta" />
                <button type="button" class="sm-buscador-limpiar" title="Limpiar búsqueda (Esc)"><i class="ti ti-x"></i></button>
            </div>
            <select class="sm-select js-gestion" style="width:auto;min-width:150px;" aria-label="Gestión">
                <option value="">Todas las gestiones</option>
                <option th:each="g : ${gestiones}" th:value="${g}" th:text="${'Gestión ' + g}"
                        th:selected="${g == gestionInicial}"></option>
            </select>
            <div style="min-width:220px;" title="Hojas con algún movimiento que salió de esta unidad">
                <select class="sm-select js-unidad" aria-label="Unidad de origen" style="width:100%;">
                    <option value="">Todas las unidades</option>
                    <option th:each="u : ${listaUnidades}" th:value="${u.idUnidad}" th:text="${u.nombre}"></option>
                </select>
            </div>
            <div class="sm-segmento js-segmento" role="group" aria-label="Filtrar por estado">
                <button type="button" class="activo" data-filtro="">Todas <span class="sm-cuenta" data-cuenta="todos">0</span></button>
                <button type="button" data-filtro="RECIBIDO">Recibidas <span class="sm-cuenta" data-cuenta="RECIBIDO">0</span></button>
                <button type="button" data-filtro="ENVIADO">Enviadas <span class="sm-cuenta" data-cuenta="ENVIADO">0</span></button>
                <button type="button" data-filtro="ARCHIVADO">Archivadas <span class="sm-cuenta" data-cuenta="ARCHIVADO">0</span></button>
            </div>
            <div class="sm-toolbar-grupo">
                <label class="sm-filas">
                    <i class="ti ti-list-numbers"></i> Filas
                    <select class="sm-select js-largo" aria-label="Filas por página">
                        <option value="auto" selected>Ajustar a pantalla</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="-1">Todas</option>
                    </select>
                </label>
            </div>
        </div>
        <div class="js-tabla"><th:block th:replace="~{hojaRuta/tabla :: tabla}"></th:block></div>
    </section>

    <section class="sm-card">
        <div class="hrs-detalle-cuerpo js-detalle">
            <div class="sm-vacio">
                <i class="ti ti-route"></i>
                <h6 class="mb-1">Ninguna hoja seleccionada</h6>
                <p class="mb-0">Elija una hoja de la lista para ver sus datos y la trayectoria del documento.</p>
            </div>
        </div>
    </section>
</div>

</div>

<script>
    (function () {
        'use strict';

        const URL_BASE = '/administracion/hoja-ruta';
        const $raiz = $('#modHojaRuta');
        const $tarjeta = $raiz.find('.js-tarjeta-lista');
        const $cont = $raiz.find('.js-tabla');
        const $det = $raiz.find('.js-detalle');
        const $gestion = $raiz.find('.js-gestion');
        const $unidad = $raiz.find('.js-unidad');
        // SciafModulo.escapar no escapa comillas: acá también se usa dentro de title="…".
        const esc = function (t) { return SciafModulo.escapar(t).replace(/"/g, '&quot;'); };

        let api = null;
        let filtroEstado = '';
        let seleccionada = null;     // id de la hoja abierta en el detalle
        let pedidoDetalle = 0;       // descarta respuestas de una hoja que ya no es la elegida

        $unidad.select2({
            dropdownParent: $raiz,
            width: '100%',
            placeholder: 'Todas las unidades',
            allowClear: true,
            language: { noResults: function () { return 'Sin resultados'; } }
        });

        /* ── Tabla ─────────────────────────────────────────────────────── */
        function contar() {
            const c = { todos: 0, RECIBIDO: 0, ENVIADO: 0, ARCHIVADO: 0 };
            api.rows().nodes().each(function (tr) {
                c.todos++;
                if (c[tr.dataset.estado] !== undefined) c[tr.dataset.estado]++;
            });
            Object.keys(c).forEach(function (k) { $raiz.find('[data-cuenta="' + k + '"]').text(c[k]); });
            $raiz.find('.js-tramite').text(c.RECIBIDO + c.ENVIADO);
        }

        function iniciarTabla() {
            api = SciafModulo.tabla({
                tabla: $cont.find('table'),
                buscador: $raiz.find('.js-buscar'),
                largo: $raiz.find('.js-largo'),
                total: $raiz.find('.js-total'),
                orden: [],
                altoFila: 62,
                filtroFila: function (tr) { return !filtroEstado || tr.dataset.estado === filtroEstado; },
                dt: {
                    columnDefs: [ { targets: 6, visible: false } ],
                    language: { sEmptyTable: 'No hay hojas de ruta con estos filtros.' }
                }
            });
            if (!api) return;
            contar();
            if (seleccionada != null) {
                $(api.rows().nodes()).filter('[data-id="' + seleccionada + '"]').addClass('hrs-sel');
            }
        }

        // Cambiar gestión o unidad vuelve a pedir la tabla; mientras, los filtros quedan quietos
        // (dos pedidos seguidos podían llegar al revés y dejar la tabla de la gestión anterior).
        function recargar() {
            $gestion.prop('disabled', true);
            $unidad.prop('disabled', true);
            $tarjeta.addClass('sm-procesando');
            $cont.css('opacity', 0.55);
            return SciafModulo.cargar($cont, URL_BASE + '/seguimiento/tabla', {
                gestion: $gestion.val(),
                unidadOrigenId: $unidad.val() || ''
            }).then(iniciarTabla)
                .catch(function (e) { SciafModulo.avisarError(e, 'No se pudo actualizar el listado'); })
                .finally(function () {
                    $gestion.prop('disabled', false);
                    $unidad.prop('disabled', false);
                    $tarjeta.removeClass('sm-procesando');
                    $cont.css('opacity', 1);
                });
        }
        $gestion.on('change', recargar);
        $unidad.on('change', recargar);

        $raiz.on('click', '.js-segmento button', function () {
            filtroEstado = this.dataset.filtro || '';
            $raiz.find('.js-segmento button').removeClass('activo');
            $(this).addClass('activo');
            if (api) api.draw();
        });

        /* ── Detalle ───────────────────────────────────────────────────── */
        // AAAA-MM-DD → DD/MM/AAAA sin pasar por Date (en UTC daba el día anterior).
        function fecha(f) {
            const p = String(f || '').split('-');
            return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '—';
        }
        function hora(h) { return h ? String(h).slice(0, 5) : ''; }
        function monto(m) {
            if (m == null || m === '') return '—';
            const n = Number(m);
            return isNaN(n) ? esc(m) : n.toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Bs';
        }
        function pastilla(e) {
            const cls = e === 'RECIBIDO' ? 'sm-pastilla-activo' : e === 'ENVIADO' ? 'sm-pastilla-info'
                : e === 'ARCHIVADO' ? 'hrs-pastilla-archivado' : 'sm-pastilla-aviso';
            return '<span class="sm-pastilla ' + cls + '">' + esc(e) + '</span>';
        }
        function campo(etiqueta, valor, ancho) {
            return '<div' + (ancho ? ' class="hrs-campo-ancho"' : '') + '><div class="hrs-campo-l">' + etiqueta
                + '</div><div class="hrs-campo-v sm-mayus">' + valor + '</div></div>';
        }

        function htmlDetalle(res) {
            const hr = res.hojaRuta || {};
            const movs = res.movimientos || [];
            const solicitante = hr.solicitanteNombre
                ? esc(hr.solicitanteNombre) + (hr.solicitanteCargo ? '<div class="sm-sub sm-mayus">' + esc(hr.solicitanteCargo) + '</div>' : '')
                : '—';

            const trayectoria = movs.length
                ? '<ol class="hrs-tl">' + movs.map(function (m, i) {
                    return '<li class="hrs-ev' + (i === 0 ? ' hrs-ev-actual' : '') + '">'
                        + '<span class="hrs-ev-punto" data-e="' + esc(m.estado) + '"></span>'
                        + '<div class="hrs-ev-tarjeta">'
                        + '<div class="hrs-ev-fila">' + pastilla(m.estado)
                        + '<span class="hrs-ev-fecha">' + (i === 0 ? '<b class="text-primary me-1">ACTUAL</b>' : '')
                        + fecha(m.fecha) + (hora(m.hora) ? ' · ' + hora(m.hora) : '') + '</span></div>'
                        + '<div class="hrs-flujo"><span class="hrs-unidad" title="' + esc(m.origen) + '">' + esc(m.origen) + '</span>'
                        + '<i class="ti ti-arrow-right sm-sub"></i>'
                        + '<span class="hrs-unidad" title="' + esc(m.destino) + '">' + esc(m.destino) + '</span></div>'
                        + (m.observacion ? '<div class="hrs-obs"><i class="ti ti-notes me-1"></i>' + esc(m.observacion) + '</div>' : '')
                        + '</div></li>';
                }).join('') + '</ol>'
                : '<div class="sm-sub">Esta hoja de ruta no tiene movimientos registrados.</div>';

            return '<div class="hrs-det-cab"><div>'
                + '<div class="sm-sub sm-mayus">Hoja de ruta ' + esc(hr.tipo || '') + ' · Gestión ' + esc(hr.gestion || '—') + '</div>'
                + '<h5 class="hrs-det-numero sm-codigo">N° ' + esc(hr.codigo || '—') + '</h5></div>'
                + pastilla(res.movimientoActual || 'SIN MOVIMIENTOS') + '</div>'
                + '<div class="sm-seccion"><div class="sm-seccion-cab"><i class="ti ti-file-description"></i> Datos</div>'
                + '<div class="sm-seccion-cuerpo"><div class="hrs-campos">'
                + campo('Solicitante', solicitante, true)
                + campo('N° certificación', esc(hr.certificacion || '—'))
                + campo('Monto', monto(hr.monto))
                + campo('Descripción', esc(hr.descripcion || '—'), true)
                + '</div></div></div>'
                + '<div class="sm-seccion mb-0"><div class="sm-seccion-cab"><i class="ti ti-route"></i> Trayectoria'
                + ' <span class="sm-sub ms-1">(' + movs.length + (movs.length === 1 ? ' movimiento' : ' movimientos') + ')</span></div>'
                + '<div class="sm-seccion-cuerpo">' + trayectoria + '</div></div>';
        }

        function verDetalle(id) {
            const n = ++pedidoDetalle;
            const carga = SciafPrecarga.montar($det, {
                compacta: true,
                texto: 'Cargando trayectoria…',
                alReintentar: function () { verDetalle(id); }
            });
            SciafModulo.pedirJson(URL_BASE + '/buscar', { datos: { idHojaRuta: id } }).then(function (res) {
                if (n !== pedidoDetalle) return;
                if (!res.ok) {
                    carga.error('No se pudo abrir la hoja de ruta', res.msg || 'Intente de nuevo.');
                    return;
                }
                carga.cerrar();
                $det.html(htmlDetalle(res));
                $det.scrollTop(0);
            }, function (e) {
                if (n !== pedidoDetalle) return;
                carga.error(e && e.sesionPerdida ? 'La sesión se cerró' : 'No se pudo abrir la hoja de ruta',
                    e && e.sesionPerdida ? SciafPrecarga.motivo(401) : ((e && e.message) || SciafPrecarga.motivo(0)));
            });
        }

        function elegir(tr) {
            const id = tr.dataset.id;
            if (!id) return;
            seleccionada = id;
            if (api) $(api.rows().nodes()).removeClass('hrs-sel');
            $(tr).addClass('hrs-sel');
            verDetalle(id);
            // En pantallas angostas el detalle queda debajo de la lista.
            if (window.innerWidth < 992) $det[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        $raiz.on('click', 'tr.hrs-fila', function () { elegir(this); });
        $raiz.on('keydown', 'tr.hrs-fila', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); elegir(this); }
        });

        SciafModulo.ajustarAlto($det, 12);
        iniciarTabla();
    })();
</script>
