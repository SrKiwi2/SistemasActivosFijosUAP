<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: predio/tabla_registro.html — predios (unidades administrativas del VSIAF).
     · Al abrir llega incluido en predio/vista.html (th:replace … :: tabla).
       POST /administracion/predio/tabla-registros lo devuelve para recargar.
     · .js-sync-info: estado de la última sincronización (la vista lo pasa a la cabecera).
     · data-config: si el predio tiene municipio y código (prefijo de los códigos de activo).
     · Una fila sin id viene directo del VSIAF (la base todavía no la tiene): solo lectura.
     ══════════════════════════════════════════════════════════════ -->
<div class="js-contenido" th:fragment="tabla">
    <span class="js-sync-info d-none"
          th:attr="data-ultima=${ultimaSincronizacion ?: 'Nunca'}, data-estado=${estadoSync ?: 'PENDIENTE'},
                   data-procesados=${registrosProcesados ?: 0}, data-nuevos=${registrosNuevos ?: 0},
                   data-actualizados=${registrosActualizados ?: 0}, data-duracion=${duracionUltimaSync ?: 0},
                   data-origen=${sourceUsed}"></span>

    <table class="table sm-tabla align-middle js-tabla-predios">
        <thead>
            <tr>
                <th style="width:110px;">Unidad</th>
                <th>Predio</th>
                <th style="width:230px;">Codificación de activos</th>
                <th style="width:120px;">Oficinas</th>
                <th style="width:120px;">En el VSIAF</th>
                <th class="text-end" style="width:170px;">Opciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p, it : ${listasPredios}"
                th:with="conf=${p.municipio != null and p.codigo != null and !#strings.isEmpty(p.codigo)},
                         nOf=${p.idPredio != null ? (oficinasPorPredio.get(p.idPredio) ?: 0) : 0}"
                th:attr="data-config=${conf ? 'si' : 'no'}, data-oficinas=${nOf}">
                <td><span class="sm-codigo sm-mayus" th:text="${p.unidad}"></span></td>
                <td>
                    <span class="sm-nombre" th:text="${p.descrip ?: '—'}"></span>
                    <div class="sm-sub">
                        <th:block th:if="${p.ciudad != null and !#strings.isEmpty(p.ciudad)}" th:text="${p.ciudad}"></th:block>
                        <th:block th:if="${p.entidad != null}"
                                  th:text="${(p.ciudad != null and !#strings.isEmpty(p.ciudad) ? ' · ' : '') + 'Entidad ' + p.entidad.entidadCodigo + ' (' + p.entidad.gestion + ')'}"></th:block>
                    </div>
                </td>
                <td th:attr="data-order=${conf ? p.municipio.codigo + '-' + p.codigo : ''}">
                    <th:block th:if="${conf}">
                        <span class="sm-pastilla sm-pastilla-activo py-0 sm-mayus" title="Prefijo de los códigos de activo"
                              th:text="${p.municipio.codigo + '-' + p.codigo}"></span>
                        <div class="sm-sub" th:text="${p.municipio.nombre}"></div>
                    </th:block>
                    <span th:unless="${conf}" class="sm-pastilla sm-pastilla-aviso py-0"
                          title="Sin municipio o código: no se pueden registrar activos en sus oficinas">
                        <i class="ti ti-alert-triangle"></i> Sin configurar</span>
                </td>
                <td th:attr="data-order=${nOf}">
                    <span th:if="${nOf > 0}" class="sm-pastilla sm-pastilla-info py-0">
                        <i class="ti ti-building"></i> <span th:text="${nOf}"></span></span>
                    <span th:if="${nOf == 0}" class="sm-sub">—</span>
                </td>
                <td>
                    <span th:if="${p.estadoUni == 1}" class="sm-pastilla sm-pastilla-activo py-0">Activo</span>
                    <span th:if="${p.estadoUni != null and p.estadoUni != 1}" class="sm-pastilla sm-pastilla-inactivo py-0">Inactivo</span>
                    <span th:if="${p.estadoUni == null}" class="sm-sub">—</span>
                </td>
                <td class="text-end">
                    <div class="sm-acciones" th:if="${p.idPredio != null and esAdmin == true}"
                         th:attr="data-id=${id_encryptado[it.index]}, data-nombre=${p.unidad}">
                        <button type="button" class="sm-btn sm-btn-sm sm-btn-suave" data-accion="configurar"
                                title="Municipio y código del predio (prefijo de los códigos de activo)">
                            <i class="ti ti-settings"></i> Configurar</button>
                    </div>
                    <span th:if="${p.idPredio == null}" class="sm-pastilla sm-pastilla-aviso py-0"
                          title="Viene directo del VSIAF: sincronice para poder configurarlo">
                        <i class="ti ti-lock"></i> Solo lectura</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
