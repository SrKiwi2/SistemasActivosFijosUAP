<!-- ═══════════════════════════════════════════════════════════════
     FRAGMENTO: entidad/tabla_registro.html — entidades (instituciones) del VSIAF.
     · Al abrir llega incluido en entidad/vista.html (th:replace … :: tabla).
       POST /administracion/entidad/tabla-registros lo devuelve para recargar.
     · .js-sync-info: estado de la última sincronización (la vista lo pasa a la cabecera).
     · Solo lectura: el catálogo es del VSIAF (ENTIDAD.DBF) y se trae sincronizando.
     ══════════════════════════════════════════════════════════════ -->
<div class="js-contenido" th:fragment="tabla">
    <span class="js-sync-info d-none"
          th:attr="data-ultima=${ultimaSincronizacion ?: 'Nunca'}, data-estado=${estadoSync ?: 'PENDIENTE'},
                   data-procesados=${registrosProcesados ?: 0}, data-nuevos=${registrosNuevos ?: 0},
                   data-actualizados=${registrosActualizados ?: 0}, data-duracion=${duracionUltimaSync ?: 0},
                   data-origen=${sourceUsed}"></span>

    <table class="table sm-tabla align-middle js-tabla-entidad">
        <thead>
            <tr>
                <th style="width:110px;">Gestión</th>
                <th style="width:120px;">Código</th>
                <th>Entidad</th>
                <th style="width:150px;">Sigla</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${listasEntidades}" th:attr="data-gestion=${e.gestion}">
                <td th:attr="data-order=${e.gestion}">
                    <span class="sm-pastilla sm-pastilla-info py-0" th:text="${e.gestion}"></span>
                </td>
                <td><span class="sm-codigo sm-mayus" th:text="${e.entidadCodigo}"></span></td>
                <td>
                    <span class="sm-nombre" th:text="${e.descripcion ?: '—'}"></span>
                    <!-- Clasificación institucional tal como la guarda el VSIAF -->
                    <div class="sm-sub"
                         th:if="${e.sectorEnt != null or e.subsecEnt != null or e.areaEnt != null or e.subareaEnt != null or e.nivelInst != null}">
                        <th:block th:if="${e.sectorEnt != null}" th:text="${'Sector ' + e.sectorEnt}"></th:block>
                        <th:block th:if="${e.subsecEnt != null}" th:text="${' · Subsector ' + e.subsecEnt}"></th:block>
                        <th:block th:if="${e.areaEnt != null}" th:text="${' · Área ' + e.areaEnt}"></th:block>
                        <th:block th:if="${e.subareaEnt != null}" th:text="${' · Subárea ' + e.subareaEnt}"></th:block>
                        <th:block th:if="${e.nivelInst != null}" th:text="${' · Nivel ' + e.nivelInst}"></th:block>
                    </div>
                </td>
                <td>
                    <span th:if="${e.sigla != null and !#strings.isEmpty(e.sigla)}" class="sm-pastilla py-0 sm-mayus"
                          th:text="${e.sigla}"></span>
                    <span th:unless="${e.sigla != null and !#strings.isEmpty(e.sigla)}" class="sm-sub">—</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
