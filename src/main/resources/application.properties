spring.sql.init.mode=never

legacy.dbf.path=/mnt/dbfwin
legacy.dbf.transferencias.path=/mnt/vsiaf_transferencias

# Modo de escritura a los DBF del VSIAF:
#   cola  = deja ordenes en _cola/ para el worker VFPOLEDB (mantiene el indice .CDX, sin reindexar)
#   bytes = append crudo legacy (rompe el indice; requiere reindexar)
legacy.dbf.write.mode=bytes

spring.application.name=SistemasActivosFijosUAP
server.port=9696

spring.output.ansi.enabled=ALWAYS

# HIBERNATE BATCH
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

spring.datasource.url=jdbc:postgresql://virtual.uap.edu.bo:5432/bd_a3?\
reWriteBatchedInserts=true&\
prepareThreshold=1&\
preparedStatementCacheQueries=256&\
preparedStatementCacheSizeMiB=5

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Intervalo de polling en milisegundos (20 segundos)
sync.poll.interval.ms=20000
# Delay inicial antes del primer poll (15 segundos, para que Spring arranque completo)
sync.poll.initial.delay.ms=15000
sync.poll.activo.interval.ms=60000
sync.poll.cooldown.ms=30000

