<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a"  viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="am" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fa8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8a4f"/></marker>
    <marker id="ar" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="1360" height="940" fill="#FFFFFF"/>
  <text x="680" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Arquitectura de interoperabilidad DBF &#8644; PostgreSQL</text>

  <!-- ===== Network band ===== -->
  <rect x="612" y="70" width="156" height="820" fill="#F3F4F7"/>
  <text x="628" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#9aa3ad" transform="rotate(-90 628 480)">RED  CIFS / SMB</text>

  <!-- ===================== VM UBUNTU ===================== -->
  <rect x="30" y="70" width="582" height="820" rx="8" fill="#FFF7F3" stroke="#E95420" stroke-width="2"/>
  <rect x="30" y="70" width="582" height="36" rx="8" fill="#E95420"/>
  <text x="321" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">VM Ubuntu &#183; Servidor SCIAF (producción) &#8212; 172.16.22.7</text>

  <!-- SCIAF app -->
  <rect x="50" y="124" width="410" height="46" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="255" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Aplicación SCIAF</text>
  <text x="255" y="162" text-anchor="middle" font-size="10.5" fill="#555">Spring Boot 3.4.4 / Java 21 &#183; MVC + Thymeleaf</text>

  <!-- Interop component -->
  <rect x="50" y="188" width="545" height="352" rx="8" fill="#EBEFF3" stroke="#44617A" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="322" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#22384a">Componente de Interoperabilidad (3 niveles)</text>

  <rect x="68" y="228" width="510" height="74" rx="6" fill="#FFFFFF" stroke="#44617A" stroke-width="1.3"/>
  <text x="323" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22384a">Nivel 1 &#183; Lectura &#8212; JavaDbfService</text>
  <text x="323" y="270" text-anchor="middle" font-size="10.5" fill="#555">Lee los DBF (charset CP1252) &#8594; DTOs</text>
  <text x="323" y="286" text-anchor="middle" font-size="10.5" fill="#555">y sincroniza hacia PostgreSQL</text>

  <rect x="68" y="316" width="510" height="94" rx="6" fill="#FFFFFF" stroke="#44617A" stroke-width="1.3"/>
  <text x="323" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22384a">Nivel 2 &#183; Escritura &#8212; DbfWriter / DbfColaService</text>
  <text x="323" y="358" text-anchor="middle" font-size="10.5" fill="#555">Acción deliberada (alta / edición / baja / transferencia)</text>
  <text x="323" y="374" text-anchor="middle" font-size="10.5" fill="#555">modo cola: genera una orden JSON y la deja en _cola/</text>
  <text x="323" y="394" text-anchor="middle" font-size="10" fill="#888" font-style="italic">legacy.dbf.write.mode = cola | bytes</text>

  <rect x="68" y="424" width="510" height="74" rx="6" fill="#FFFFFF" stroke="#44617A" stroke-width="1.3"/>
  <text x="323" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22384a">Nivel 3 &#183; Sincronización &#8212; SyncScheduler / DbfChangeDetector</text>
  <text x="323" y="466" text-anchor="middle" font-size="10.5" fill="#555">Detección de cambios programada</text>
  <text x="323" y="482" text-anchor="middle" font-size="10.5" fill="#555">y notificación en tiempo real (SSE)</text>

  <!-- PostgreSQL cylinder -->
  <path d="M88,602 a72,14 0 0,0 144,0 l0,76 a72,14 0 0,1 -144,0 z" fill="#D6E4F0" stroke="#336791" stroke-width="1.5"/>
  <ellipse cx="160" cy="602" rx="72" ry="14" fill="#E4EEF6" stroke="#336791" stroke-width="1.5"/>
  <text x="160" y="640" text-anchor="middle" font-size="12.5" font-weight="700" fill="#23496b">PostgreSQL</text>
  <text x="160" y="658" text-anchor="middle" font-size="10" fill="#23496b">bd_a4</text>

  <!-- SSE clients -->
  <rect x="330" y="600" width="250" height="66" rx="6" fill="#E3F2EF" stroke="#2E8B7F" stroke-width="1.4"/>
  <text x="455" y="628" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6b60">Clientes web</text>
  <text x="455" y="646" text-anchor="middle" font-size="10.5" fill="#555">notificaciones SSE en tiempo real</text>

  <!-- Flow legend -->
  <rect x="50" y="700" width="545" height="172" rx="6" fill="#FFFFFF" stroke="#bbb" stroke-width="1"/>
  <text x="64" y="722" font-size="12" font-weight="700" fill="#333">Flujo de interoperabilidad</text>
  <text x="64" y="744" font-size="10.6" fill="#333">&#9312;  Lectura: lee los DBF y los sincroniza a PostgreSQL.</text>
  <text x="64" y="765" font-size="10.6" fill="#333">&#9313;  Escritura: ante una acción deliberada, deja una orden JSON en _cola/.</text>
  <text x="64" y="786" font-size="10.6" fill="#333">&#9314;  Worker: lee _cola/ y ejecuta INSERT/UPDATE con VFPOLEDB (mantiene .CDX).</text>
  <text x="64" y="807" font-size="10.6" fill="#333">&#9315;  Worker: mueve la orden a _hechos/ (OK) o _errores/ (falla) y registra worker.log.</text>
  <text x="64" y="828" font-size="10.6" fill="#333">&#9316;  Sincronización: detecta cambios y notifica en tiempo real (SSE).</text>
  <text x="64" y="855" font-size="10" fill="#888" font-style="italic">PostgreSQL = entorno de trabajo (sandbox) &#183; VSIAF = producción oficial. Solo recibe acciones deliberadas.</text>

  <!-- ===================== VM WINDOWS ===================== -->
  <rect x="768" y="70" width="562" height="820" rx="8" fill="#F3F9FE" stroke="#0078D4" stroke-width="2"/>
  <rect x="768" y="70" width="562" height="36" rx="8" fill="#0078D4"/>
  <text x="1049" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">VM Windows &#183; Servidor VSIAF (oficial) &#8212; 172.16.21.4</text>

  <!-- Shared folder container -->
  <rect x="788" y="124" width="524" height="388" rx="8" fill="#FAFCFE" stroke="#0078D4" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="1050" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#005a9e">Carpeta compartida SMB &#183; C:\vsiaf\vsiaf_red\dbfs</text>

  <!-- DBF files -->
  <rect x="806" y="160" width="488" height="86" rx="6" fill="#FBEDD9" stroke="#C77B2C" stroke-width="1.6"/>
  <text x="1050" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4a12">Archivos DBF (FoxPro)</text>
  <text x="1050" y="202" text-anchor="middle" font-size="10.5" fill="#5a4020">ACTUAL.DBF &#183; OFICINA.DBF &#183; RESP.DBF &#183; AUXILIAR.DBF &#8230;</text>
  <text x="1050" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a4a12">+ índice .CDX  (debe mantenerse íntegro)</text>

  <!-- cola folders -->
  <rect x="806" y="280" width="150" height="72" rx="6" fill="#FFF3CD" stroke="#C8972B" stroke-width="1.5"/>
  <text x="881" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6516">_cola/</text>
  <text x="881" y="322" text-anchor="middle" font-size="9.5" fill="#7a5b00">órdenes JSON</text>
  <text x="881" y="336" text-anchor="middle" font-size="9.5" fill="#7a5b00">pendientes</text>

  <rect x="970" y="280" width="150" height="72" rx="6" fill="#D7E8D5" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="1045" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#2c6b3c">_hechos/</text>
  <text x="1045" y="322" text-anchor="middle" font-size="9.5" fill="#2c6b3c">procesadas</text>
  <text x="1045" y="336" text-anchor="middle" font-size="9.5" fill="#2c6b3c">correctamente</text>

  <rect x="1134" y="280" width="160" height="72" rx="6" fill="#F6D9D6" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1214" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#9a2b22">_errores/</text>
  <text x="1214" y="322" text-anchor="middle" font-size="9.5" fill="#9a2b22">orden fallida</text>
  <text x="1214" y="336" text-anchor="middle" font-size="9.5" fill="#9a2b22">+ .error.txt</text>

  <!-- worker.log -->
  <rect x="893" y="468" width="98" height="34" rx="5" fill="#ECEFF1" stroke="#888" stroke-width="1.2"/>
  <text x="942" y="490" text-anchor="middle" font-size="10.5" font-weight="700" fill="#555">worker.log</text>

  <!-- Worker -->
  <rect x="788" y="540" width="524" height="120" rx="8" fill="#DCE6F5" stroke="#1F5FA8" stroke-width="1.8"/>
  <text x="1050" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#143d6b">Worker PowerShell &#183; Worker-Vsiaf.ps1 (32-bit)</text>
  <text x="1050" y="588" text-anchor="middle" font-size="11" fill="#234">Proveedor VFPOLEDB (OLE DB de Visual FoxPro)</text>
  <text x="1050" y="608" text-anchor="middle" font-size="11" fill="#234">INSERT / UPDATE sobre los DBF</text>
  <text x="1050" y="628" text-anchor="middle" font-size="11" font-weight="700" fill="#143d6b">&#8594; mantiene el índice .CDX (sin reindexar)</text>
  <text x="1050" y="648" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">Tarea programada permanente (schtasks /RU SYSTEM)</text>

  <!-- sayove resource -->
  <rect x="788" y="696" width="524" height="58" rx="6" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.4"/>
  <text x="1050" y="720" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">Recurso SMB &#8216;sayove&#8217;</text>
  <text x="1050" y="738" text-anchor="middle" font-size="10.5" fill="#455a64">solicitudes de transferencia del sistema legado</text>

  <!-- ===================== FLOW ARROWS ===================== -->
  <!-- (1) read DBF -> Nivel 1 -->
  <line x1="806" y1="200" x2="580" y2="258" stroke="#2f5fa8" stroke-width="1.8" marker-end="url(#am)"/>
  <!-- (2) Nivel 2 -> _cola -->
  <line x1="580" y1="360" x2="806" y2="316" stroke="#2f5fa8" stroke-width="1.8" marker-end="url(#am)"/>
  <!-- mount labels -->
  <text x="690" y="232" text-anchor="middle" font-size="9" fill="#2f5fa8">//172.16.21.4/dbfs</text>
  <text x="690" y="244" text-anchor="middle" font-size="9" fill="#2f5fa8">&#8594; /mnt/dbfwin</text>
  <text x="690" y="600" text-anchor="middle" font-size="9" fill="#2f5fa8">//172.16.21.4/sayove</text>
  <text x="690" y="612" text-anchor="middle" font-size="9" fill="#2f5fa8">&#8594; /mnt/vsiaf_transferencias</text>

  <!-- sayove -> interop (mount 2) -->
  <line x1="788" y1="710" x2="580" y2="470" stroke="#2f5fa8" stroke-width="1.6" marker-end="url(#am)"/>

  <!-- interop <-> PostgreSQL -->
  <line x1="160" y1="540" x2="160" y2="600" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="205" y="575" font-size="9.5" fill="#555">&#8644; PG</text>
  <!-- app <-> interop -->
  <line x1="255" y1="170" x2="255" y2="188" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- Nivel 3 -> SSE -->
  <line x1="400" y1="498" x2="450" y2="600" stroke="#2E8B7F" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- (3) _cola -> worker -->
  <line x1="840" y1="352" x2="840" y2="540" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- (3) worker -> DBF (right elbow) -->
  <polyline points="1300,540 1305,540 1305,200 1294,200" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- (4) worker -> _hechos -->
  <line x1="1045" y1="540" x2="1045" y2="352" stroke="#3a8a4f" stroke-width="1.6" marker-end="url(#ag)"/>
  <!-- (4) worker -> _errores -->
  <line x1="1210" y1="540" x2="1210" y2="352" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- worker -> log -->
  <line x1="942" y1="540" x2="942" y2="502" stroke="#888" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ===================== CIRCLED STEP NUMBERS ===================== -->
  <g font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="690" cy="206" r="11" fill="#2E7D6B"/><text x="690" y="210">1</text>
    <circle cx="690" cy="350" r="11" fill="#2E7D6B"/><text x="690" y="354">2</text>
    <circle cx="840" cy="446" r="11" fill="#2E7D6B"/><text x="840" y="450">3</text>
    <circle cx="1305" cy="380" r="11" fill="#2E7D6B"/><text x="1305" y="384">3</text>
    <circle cx="1045" cy="446" r="11" fill="#3a8a4f"/><text x="1045" y="450">4</text>
    <circle cx="1210" cy="446" r="11" fill="#C0392B"/><text x="1210" y="450">4</text>
    <circle cx="430" cy="556" r="11" fill="#2E7D6B"/><text x="430" y="560">5</text>
  </g>

  <text x="20" y="918" font-size="10" fill="#777" font-style="italic">La VM Ubuntu nunca escribe los DBF directamente: deja órdenes en _cola/ a través del montaje CIFS, y el worker de la VM Windows las aplica con VFPOLEDB preservando el índice .CDX. Elaboración propia.</text>
</svg>
